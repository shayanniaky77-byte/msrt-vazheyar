,"w":"elaborate","fa":"پیچیده و پرجزئیات","syn":"detailed","pos":"adj","example":"The engineer created an elaborate design.","translation":"مهندس طرحی پرجزئیات ساخت.","lesson":10,"day":1,"week":1},{"id":288,"w":"nominal","fa":"اسمی، ناچیز","syn":"minimal","pos":"adj","example":"The course charges a nominal fee.","translation":"دوره هزینه‌ای ناچیز دریافت می‌کند.","lesson":17,"day":2,"week":1},{"id":97,"w":"instantaneous","fa":"آنی، فوری","syn":"immediate","pos":"adj","example":"The reaction was almost instantaneous.","translation":"واکنش تقریباً آنی بود.","lesson":6,"day":2,"week":1},{"id":111,"w":"distort","fa":"تحریف کردن، تغییر شکل دادن","syn":"twist","pos":"v","example":"Poor lighting can distort the colors.","translation":"نور نامناسب ممکن است رنگ‌ها را تحریف کند.","lesson":7,"day":2,"week":1},{"id":6,"w":"aspect","fa":"جنبه، بُعد","syn":"facet","pos":"n","example":"The study examines every aspect of learning.","translation":"این مطالعه همه جنبه‌های یادگیری را بررسی می‌کند.","lesson":1,"day":2,"week":1},{"id":297,"w":"fallacious","fa":"مغالطه‌آمیز، نادرست","syn":"misleading","pos":"adj","example":"The conclusion rests on a fallacious assumption.","translation":"نتیجه بر فرضی نادرست استوار است.","lesson":18,"day":2,"week":1},{"id":228,"w":"enact","fa":"تصویب و اجرایی کردن قانون","syn":"legislate","pos":"v","example":"Parliament may enact stricter rules.","translation":"پارلمان ممکن است مقررات سخت‌گیرانه‌تری تصویب کند.","lesson":14,"day":2,"week":1},{"id":26,"w":"contemporary","fa":"معاصر، امروزی","syn":"modern","pos":"adj","example":"Contemporary art reflects social change.","translation":"هنر معاصر بازتاب‌دهنده تغییر اجتماعی است.","lesson":2,"day":2,"week":1},{"id":32,"w":"myth","fa":"افسانه، باور نادرست","syn":"legend","pos":"n","example":"Researchers questioned the popular myth.","translation":"پژوهشگران آن باور رایج نادرست را زیر سؤال بردند.","lesson":2,"day":2,"week":1},{"id":33,"w":"refine","fa":"بهبود دادن، پالایش کردن","syn":"improve","pos":"v","example":"We need to refine the research method.","translation":"باید روش پژوهش را بهبود دهیم.","lesson":2,"day":2,"week":1},{"id":120,"w":"accelerate","fa":"شتاب گرفتن، سرعت بخشیدن","syn":"speed up","pos":"v","example":"Heat can accelerate the reaction.","translation":"گرما می‌تواند سرعت واکنش را افزایش دهد.","lesson":8,"day":2,"week":1},{"id":88,"w":"commonplace","fa":"رایج، معمول","syn":"ordinary","pos":"adj","example":"Online meetings are now commonplace.","translation":"جلسه‌های آنلاین اکنون امری رایج‌اند.","lesson":6,"day":3,"week":1},{"id":200,"w":"evaporate","fa":"تبخیر شدن","syn":"vaporize","pos":"v","example":"Water begins to evaporate as it warms.","translation":"آب با گرم‌شدن شروع به تبخیر می‌کند.","lesson":12,"day":3,"week":1},{"id":207,"w":"elude","fa":"گریختن از، دست‌نیافتنی ماندن","syn":"evade","pos":"v","example":"The answer continued to elude the researchers.","translation":"پاسخ همچنان از دسترس پژوهشگران دور می‌ماند.","lesson":13,"day":3,"week":1},{"id":264,"w":"mimic","fa":"تقلید کردن","syn":"imitate","pos":"v","example":"Some birds can mimic human speech.","translation":"برخی پرندگان می‌توانند صدای انسان را تقلید کنند.","lesson":16,"day":3,"week":1},{"id":98,"w":"rigid","fa":"سفت، انعطاف‌ناپذیر","syn":"stiff","pos":"adj","example":"Rigid rules may limit creativity.","translation":"قوانین انعطاف‌ناپذیر ممکن است خلاقیت را محدود کنند.","lesson":6,"day":3,"week":1},{"id":1,"w":"abroad","fa":"در خارج از کشور","syn":"overseas","pos":"adv","example":"Many students choose to study abroad.","translation":"بسیاری از دانشجویان تحصیل در خارج از کشور را انتخاب می‌کنند.","lesson":1,"day":3,"week":1},{"id":77,"w":"in conjunction with","fa":"همراه با، در کنار","syn":"together with","pos":"phrase","example":"The drug is used in conjunction with exercise.","translation":"دارو همراه با ورزش استفاده می‌شود.","lesson":5,"day":3,"week":1},{"id":169,"w":"superficial","fa":"سطحی","syn":"shallow","pos":"adj","example":"A superficial review may miss errors.","translation":"بررسی سطحی ممکن است خطاها را نادیده بگیرد.","lesson":10,"day":3,"week":1},{"id":227,"w":"diligent","fa":"کوشا، دقیق","syn":"hardworking","pos":"adj","example":"Diligent students revise their notes.","translation":"دانشجویان کوشا یادداشت‌هایشان را مرور می‌کنند.","lesson":14,"day":3,"week":1},{"id":34,"w":"worthwhile","fa":"ارزشمند، دارای ارزش انجام","syn":"rewarding","pos":"adj","example":"Learning these words is worthwhile.","translation":"یادگیری این واژه‌ها ارزشمند است.","lesson":2,"day":3,"week":1},{"id":79,"w":"obstruct","fa":"مسدود کردن، مانع شدن","syn":"block","pos":"v","example":"Fallen trees obstruct the road.","translation":"درختان افتاده جاده را مسدود می‌کنند.","lesson":5,"day":4,"week":1},{"id":45,"w":"intolerable","fa":"تحمل‌ناپذیر","syn":"unbearable","pos":"adj","example":"The noise became intolerable after midnight.","translation":"صدا پس از نیمه‌شب تحمل‌ناپذیر شد.","lesson":3,"day":4,"week":1},{"id":73,"w":"caution","fa":"هشدار دادن؛ احتیاط","syn":"warn","pos":"n/v","example":"Experts caution against rapid conclusions.","translation":"کارشناسان درباره نتیجه‌گیری شتاب‌زده هشدار می‌دهند.","lesson":5,"day":4,"week":1},{"id":245,"w":"harmful","fa":"زیان‌آور","syn":"damaging","pos":"adj","example":"Air pollution is harmful to health.","translation":"آلودگی هوا برای سلامتی زیان‌آور است.","lesson":15,"day":4,"week":1},{"id":142,"w":"dense","fa":"متراکم، فشرده","syn":"thick","pos":"adj","example":"Dense fog covered the valley.","translation":"مه غلیظ دره را پوشاند.","lesson":9,"day":4,"week":1},{"id":251,"w":"reject","fa":"رد کردن","syn":"refuse","pos":"v","example":"The journal may reject incomplete papers.","translation":"مجله ممکن است مقاله‌های ناقص را رد کند.","lesson":15,"day":4,"week":1},{"id":52,"w":"ambiguous","fa":"مبهم، چندپهلو","syn":"vague","pos":"adj","example":"The instructions were ambiguous to beginners.","translation":"دستورالعمل‌ها برای مبتدیان مبهم بودند.","lesson":4,"day":4,"week":1},{"id":48,"w":"propose","fa":"پیشنهاد کردن","syn":"suggest","pos":"v","example":"The authors propose a new model.","translation":"نویسندگان مدل تازه‌ای پیشنهاد می‌کنند.","lesson":3,"day":4,"week":1},{"id":272,"w":"abysmal","fa":"بسیار بد، افتضاح","syn":"appalling","pos":"adj","example":"The team received an abysmal evaluation.","translation":"گروه ارزیابی بسیار بدی دریافت کرد.","lesson":17,"day":4,"week":1},{"id":93,"w":"exceedingly","fa":"بسیار، فوق‌العاده","syn":"extremely","pos":"adv","example":"The task was exceedingly difficult.","translation":"این کار بسیار دشوار بود.","lesson":6,"day":4,"week":1},{"id":238,"w":"withstand","fa":"مقاومت کردن، تاب آوردن","syn":"endure","pos":"v","example":"The structure can withstand strong winds.","translation":"سازه می‌تواند در برابر بادهای شدید مقاومت کند.","lesson":14,"day":5,"week":1},{"id":296,"w":"exert","fa":"اعمال کردن، به کار بردن","syn":"apply","pos":"v","example":"The motor can exert considerable force.","translation":"موتور می‌تواند نیروی قابل‌توجهی اعمال کند.","lesson":18,"day":5,"week":1},{"id":292,"w":"brazen","fa":"گستاخانه و بی‌شرمانه","syn":"shameless","pos":"adj","example":"His brazen response surprised everyone.","translation":"پاسخ گستاخانه او همه را شگفت‌زده کرد.","lesson":18,"day":5,"week":1},{"id":40,"w":"ascertain","fa":"اطمینان یافتن، مشخص کردن","syn":"determine","pos":"v","example":"The study aims to ascertain the cause.","translation":"هدف مطالعه مشخص کردن علت است.","lesson":3,"day":5,"week":1},{"id":31,"w":"heyday","fa":"دوره اوج شکوفایی","syn":"peak","pos":"n","example":"The theater enjoyed its heyday in the 1980s.","translation":"تئاتر در دهه ۱۹۸۰ دوران اوج خود را تجربه کرد.","lesson":2,"day":5,"week":1},{"id":167,"w":"skeptical","fa":"شکاک، تردیددار","syn":"doubtful","pos":"adj","example":"Scientists remained skeptical of the claim.","translation":"دانشمندان نسبت به ادعا تردید داشتند.","lesson":10,"day":5,"week":1},{"id":3,"w":"acceptable","fa":"قابل قبول","syn":"satisfactory","pos":"adj","example":"This explanation is acceptable to the committee.","translation":"این توضیح برای کمیته قابل قبول است.","lesson":1,"day":5,"week":1},{"id":246,"w":"insignificant","fa":"ناچیز، بی‌اهمیت","syn":"minor","pos":"adj","example":"The difference was statistically insignificant.","translation":"تفاوت از نظر آماری معنادار نبود.","lesson":15,"day":5,"week":1},{"id":110,"w":"discrepancy","fa":"اختلاف، ناسازگاری","syn":"difference","pos":"n","example":"A discrepancy appeared between the reports.","translation":"بین گزارش‌ها اختلافی دیده شد.","lesson":7,"day":5,"week":1},{"id":109,"w":"critical","fa":"حیاتی؛ انتقادی","syn":"crucial","pos":"adj","example":"Accurate data are critical for this study.","translation":"داده‌های دقیق برای این مطالعه حیاتی‌اند.","lesson":7,"day":5,"week":1},{"id":281,"w":"gradually","fa":"به‌تدریج","syn":"slowly","pos":"adv","example":"The temperature gradually increased.","translation":"دما به‌تدریج افزایش یافت.","lesson":17,"day":6,"week":2},{"id":74,"w":"enhance","fa":"بهبود بخشیدن، تقویت کردن","syn":"improve","pos":"v","example":"Practice can enhance reading speed.","translation":"تمرین می‌تواند سرعت خواندن را افزایش دهد.","lesson":5,"day":6,"week":2},{"id":284,"w":"intentionally","fa":"عمداً، آگاهانه","syn":"deliberately","pos":"adv","example":"The researcher intentionally changed one variable.","translation":"پژوهشگر عمداً یک متغیر را تغییر داد.","lesson":17,"day":6,"week":2},{"id":223,"w":"arduous","fa":"دشوار و طاقت‌فرسا","syn":"demanding","pos":"adj","example":"The researchers completed an arduous journey.","translation":"پژوهشگران سفری طاقت‌فرسا را به پایان رساندند.","lesson":14,"day":6,"week":2},{"id":220,"w":"surpass","fa":"پیشی گرفتن، فراتر رفتن","syn":"exceed","pos":"v","example":"The results may surpass expectations.","translation":"نتایج ممکن است از انتظارها فراتر روند.","lesson":13,"day":6,"week":2},{"id":157,"w":"drab","fa":"بی‌رنگ‌ورو، کسل‌کننده","syn":"dull","pos":"adj","example":"The room looked drab without natural light.","translation":"اتاق بدون نور طبیعی کسل‌کننده به نظر می‌رسید.","lesson":10,"day":6,"week":2},{"id":242,"w":"halt","fa":"متوقف کردن","syn":"stop","pos":"v","example":"Heavy rain may halt construction.","translation":"باران شدید ممکن است ساخت‌وساز را متوقف کند.","lesson":15,"day":6,"week":2},{"id":274,"w":"comply","fa":"اطاعت کردن، مطابق مقررات عمل کردن","syn":"obey","pos":"v","example":"All laboratories must comply with the rules.","translation":"همه آزمایشگاه‌ها باید مقررات را رعایت کنند.","lesson":17,"day":6,"week":2},{"id":129,"w":"flaw","fa":"نقص، عیب","syn":"defect","pos":"n","example":"The engineer found a flaw in the design.","translation":"مهندس نقصی در طراحی پیدا کرد.","lesson":8,"day":6,"week":2},{"id":180,"w":"exaggerate","fa":"اغراق کردن","syn":"overstate","pos":"v","example":"News reports sometimes exaggerate the risk.","translation":"گزارش‌های خبری گاهی درباره خطر اغراق می‌کنند.","lesson":11,"day":6,"week":2},{"id":29,"w":"energetic","fa":"پرانرژی","syn":"vigorous","pos":"adj","example":"The energetic speaker held everyone's attention.","translation":"سخنران پرانرژی توجه همه را جلب کرد.","lesson":2,"day":7,"week":2},{"id":81,"w":"recompense","fa":"جبران کردن؛ پاداش","syn":"compensate","pos":"v/n","example":"The company agreed to recompense the workers.","translation":"شرکت موافقت کرد خسارت کارگران را جبران کند.","lesson":5,"day":7,"week":2},{"id":147,"w":"impressive","fa":"تأثیرگذار، چشمگیر","syn":"remarkable","pos":"adj","example":"The research team made impressive progress.","translation":"گروه پژوهشی پیشرفت چشمگیری داشت.","lesson":9,"day":7,"week":2},{"id":85,"w":"work out","fa":"حل کردن، به نتیجه رسیدن","syn":"solve","pos":"ph.v","example":"We must work out a practical solution.","translation":"باید راه‌حلی عملی پیدا کنیم.","lesson":5,"day":7,"week":2},{"id":165,"w":"prime","fa":"اصلی، مهم‌ترین","syn":"principal","pos":"adj","example":"Their prime objective is to reduce costs.","translation":"هدف اصلی آن‌ها کاهش هزینه‌هاست.","lesson":10,"day":7,"week":2},{"id":178,"w":"encircle","fa":"احاطه کردن","syn":"surround","pos":"v","example":"Tall trees encircle the old house.","translation":"درختان بلند خانه قدیمی را احاطه کرده‌اند.","lesson":11,"day":7,"week":2},{"id":184,"w":"overbearing","fa":"سلطه‌جو، زورگو","syn":"domineering","pos":"adj","example":"An overbearing manager limits teamwork.","translation":"مدیر سلطه‌جو کار گروهی را محدود می‌کند.","lesson":11,"day":7,"week":2},{"id":55,"w":"astounding","fa":"شگفت‌انگیز","syn":"astonishing","pos":"adj","example":"The results showed astounding improvement.","translation":"نتایج بهبودی شگفت‌انگیز نشان دادند.","lesson":4,"day":7,"week":2},{"id":10,"w":"disapproval","fa":"مخالفت، عدم تأیید","syn":"objection","pos":"n","example":"The proposal met with strong disapproval.","translation":"این پیشنهاد با مخالفت شدید روبه‌رو شد.","lesson":1,"day":7,"week":2},{"id":141,"w":"currency","fa":"واحد پول، ارز","syn":"money","pos":"n","example":"The national currency lost value.","translation":"ارز ملی ارزش خود را از دست داد.","lesson":9,"day":7,"week":2},{"id":75,"w":"facilitate","fa":"تسهیل کردن","syn":"ease","pos":"v","example":"Clear instructions facilitate learning.","translation":"دستورالعمل‌های روشن یادگیری را آسان می‌کنند.","lesson":5,"day":8,"week":2},{"id":256,"w":"convey","fa":"انتقال دادن، رساندن مفهوم","syn":"communicate","pos":"v","example":"Charts can convey complex ideas clearly.","translation":"نمودارها می‌توانند مفاهیم پیچیده را روشن انتقال دهند.","lesson":16,"day":8,"week":2},{"id":63,"w":"instigate","fa":"به راه انداختن، تحریک کردن","syn":"initiate","pos":"v","example":"The report may instigate further debate.","translation":"گزارش ممکن است بحث بیشتری را به راه بیندازد.","lesson":4,"day":8,"week":2},{"id":248,"w":"perilous","fa":"پرخطر","syn":"dangerous","pos":"adj","example":"The climbers faced a perilous route.","translation":"کوهنوردان با مسیری پرخطر روبه‌رو شدند.","lesson":15,"day":8,"week":2},{"id":53,"w":"arbitrary","fa":"دل‌بخواهی، بدون معیار مشخص","syn":"random","pos":"adj","example":"The decision seemed arbitrary and unfair.","translation":"تصمیم دل‌بخواهی و ناعادلانه به نظر می‌رسید.","lesson":4,"day":8,"week":2},{"id":83,"w":"unique","fa":"منحصربه‌فرد","syn":"distinctive","pos":"adj","example":"Each culture has unique traditions.","translation":"هر فرهنگ سنت‌های منحصربه‌فردی دارد.","lesson":5,"day":8,"week":2},{"id":107,"w":"convenient","fa":"راحت، مناسب","syn":"handy","pos":"adj","example":"This is a convenient time to meet.","translation":"این زمان مناسبی برای ملاقات است.","lesson":7,"day":8,"week":2},{"id":59,"w":"designate","fa":"تعیین کردن، منصوب کردن","syn":"appoint","pos":"v","example":"They designate one room for interviews.","translation":"آن‌ها یک اتاق را برای مصاحبه‌ها تعیین می‌کنند.","lesson":4,"day":8,"week":2},{"id":159,"w":"eclectic","fa":"متنوع و برگزیده از منابع مختلف","syn":"varied","pos":"adj","example":"The collection reflects eclectic interests.","translation":"مجموعه نشان‌دهنده علایق متنوع است.","lesson":10,"day":8,"week":2},{"id":191,"w":"burgeon","fa":"سریع رشد کردن، شکوفا شدن","syn":"flourish","pos":"v","example":"Small businesses began to burgeon.","translation":"کسب‌وکارهای کوچک شروع به شکوفایی کردند.","lesson":12,"day":8,"week":2},{"id":86,"w":"chiefly","fa":"عمدتاً، بیشتر","syn":"mainly","pos":"adv","example":"The survey focused chiefly on students.","translation":"نظرسنجی عمدتاً بر دانشجویان تمرکز داشت.","lesson":6,"day":9,"week":2},{"id":139,"w":"acute","fa":"شدید، حاد","syn":"severe","pos":"adj","example":"The patient experienced acute pain.","translation":"بیمار درد شدیدی را تجربه کرد.","lesson":9,"day":9,"week":2},{"id":244,"w":"harbor","fa":"پناه دادن؛ در دل داشتن","syn":"shelter","pos":"v","example":"Some people harbor doubts about the plan.","translation":"برخی افراد درباره طرح تردیدهایی در دل دارند.","lesson":15,"day":9,"week":2},{"id":279,"w":"endemic","fa":"بومی و رایج در منطقه‌ای خاص","syn":"native","pos":"adj","example":"The disease is endemic to the region.","translation":"این بیماری در آن منطقه بومی و شایع است.","lesson":17,"day":9,"week":2},{"id":65,"w":"petition","fa":"دادخواست، درخواست رسمی","syn":"appeal","pos":"n/v","example":"Residents signed a petition for cleaner air.","translation":"ساکنان دادخواستی برای هوای پاک‌تر امضا کردند.","lesson":4,"day":9,"week":2},{"id":174,"w":"elementary","fa":"ابتدایی، پایه","syn":"basic","pos":"adj","example":"The textbook explains elementary concepts.","translation":"کتاب درسی مفاهیم پایه را توضیح می‌دهد.","lesson":11,"day":9,"week":2},{"id":295,"w":"demeanor","fa":"رفتار و ظاهر بیرونی","syn":"manner","pos":"n","example":"The interviewer's calm demeanor reduced anxiety.","translation":"رفتار آرام مصاحبه‌گر اضطراب را کاهش داد.","lesson":18,"day":9,"week":2},{"id":212,"w":"facet","fa":"جنبه، وجه","syn":"aspect","pos":"n","example":"The report examines one facet of the issue.","translation":"گزارش یک جنبه از مسئله را بررسی می‌کند.","lesson":13,"day":9,"week":2},{"id":285,"w":"intrinsic","fa":"ذاتی، درونی","syn":"inherent","pos":"adj","example":"Curiosity has intrinsic value in education.","translation":"کنجکاوی در آموزش ارزشی ذاتی دارد.","lesson":17,"day":9,"week":2},{"id":269,"w":"unlikely","fa":"بعید، نامحتمل","syn":"improbable","pos":"adj","example":"It is unlikely to rain this evening.","translation":"بعید است امشب باران ببارد.","lesson":16,"day":9,"week":2},{"id":60,"w":"determined","fa":"مصمم","syn":"resolute","pos":"adj","example":"The determined student completed the course.","translation":"دانشجوی مصمم دوره را به پایان رساند.","lesson":4,"day":10,"week":2},{"id":215,"w":"oblivious","fa":"بی‌خبر، غافل","syn":"unaware","pos":"adj","example":"He remained oblivious to the noise.","translation":"او از سر و صدا بی‌خبر ماند.","lesson":13,"day":10,"week":2},{"id":235,"w":"pinpoint","fa":"دقیق مشخص کردن","syn":"identify","pos":"v","example":"The test can pinpoint the problem.","translation":"آزمون می‌تواند مشکل را دقیق مشخص کند.","lesson":14,"day":10,"week":2},{"id":4,"w":"acclaim","fa":"تحسین کردن؛ ستایش","syn":"praise","pos":"v/n","example":"Critics acclaim the research for its originality.","translation":"منتقدان پژوهش را به خاطر اصالتش تحسین می‌کنند.","lesson":1,"day":10,"week":2},{"id":102,"w":"visibly","fa":"به‌طور آشکار","syn":"noticeably","pos":"adv","example":"The surface was visibly damaged.","translation":"سطح به‌طور آشکار آسیب دیده بود.","lesson":6,"day":10,"week":2},{"id":91,"w":"curious","fa":"کنجکاو؛ عجیب","syn":"inquisitive","pos":"adj","example":"Curious students ask more questions.","translation":"دانشجویان کنجکاو پرسش‌های بیشتری می‌پرسند.","lesson":6,"day":10,"week":2},{"id":30,"w":"frail","fa":"ضعیف، شکننده","syn":"weak","pos":"adj","example":"The frail bridge required immediate repair.","translation":"پل فرسوده و ضعیف به تعمیر فوری نیاز داشت.","lesson":2,"day":10,"week":2},{"id":268,"w":"systematically","fa":"به‌شکل نظام‌مند","syn":"methodically","pos":"adv","example":"The researchers systematically tested each sample.","translation":"پژوهشگران هر نمونه را به‌شکل نظام‌مند آزمودند.","lesson":16,"day":10,"week":2},{"id":28,"w":"encourage","fa":"تشویق کردن","syn":"stimulate","pos":"v","example":"Good feedback can encourage students.","translation":"بازخورد خوب می‌تواند دانشجویان را تشویق کند.","lesson":2,"day":10,"week":2},{"id":22,"w":"appealing","fa":"جذاب، دلنشین","syn":"attractive","pos":"adj","example":"The new course is appealing to researchers.","translation":"دوره جدید برای پژوهشگران جذاب است.","lesson":2,"day":10,"week":2},{"id":240,"w":"adhere","fa":"پایبند بودن؛ چسبیدن","syn":"comply","pos":"v","example":"Researchers must adhere to ethical standards.","translation":"پژوهشگران باید به استانداردهای اخلاقی پایبند باشند.","lesson":15,"day":11,"week":3},{"id":116,"w":"reveal","fa":"آشکار کردن","syn":"disclose","pos":"v","example":"The figures reveal a clear trend.","translation":"اعداد روند روشنی را آشکار می‌کنند.","lesson":7,"day":11,"week":3},{"id":214,"w":"inaccessible","fa":"غیرقابل دسترس","syn":"unreachable","pos":"adj","example":"The mountain road was inaccessible in winter.","translation":"جاده کوهستانی در زمستان غیرقابل دسترس بود.","lesson":13,"day":11,"week":3},{"id":87,"w":"coarse","fa":"زبر، خشن","syn":"rough","pos":"adj","example":"Coarse sand was used in the test.","translation":"در آزمایش از ماسه زبر استفاده شد.","lesson":6,"day":11,"week":3},{"id":291,"w":"balanced","fa":"متعادل، متوازن","syn":"even","pos":"adj","example":"The report presents a balanced argument.","translation":"گزارش استدلالی متوازن ارائه می‌دهد.","lesson":18,"day":11,"week":3},{"id":154,"w":"distinct","fa":"متمایز، مشخص","syn":"different","pos":"adj","example":"The two groups show distinct patterns.","translation":"دو گروه الگوهای متمایزی نشان می‌دهند.","lesson":10,"day":11,"week":3},{"id":230,"w":"fertile","fa":"حاصلخیز، بارور","syn":"productive","pos":"adj","example":"The river deposits fertile soil.","translation":"رودخانه خاک حاصلخیز برجا می‌گذارد.","lesson":14,"day":11,"week":3},{"id":221,"w":"uphold","fa":"حفظ کردن؛ حمایت از قانون","syn":"maintain","pos":"v","example":"Judges must uphold the law.","translation":"قاضیان باید از قانون پاسداری کنند.","lesson":13,"day":11,"week":3},{"id":289,"w":"absurd","fa":"پوچ، بی‌منطق","syn":"ridiculous","pos":"adj","example":"The claim sounded absurd without evidence.","translation":"این ادعا بدون شواهد پوچ به نظر می‌رسید.","lesson":18,"day":11,"week":3},{"id":127,"w":"engender","fa":"به وجود آوردن","syn":"produce","pos":"v","example":"The policy could engender public trust.","translation":"این سیاست می‌تواند اعتماد عمومی ایجاد کند.","lesson":8,"day":11,"week":3},{"id":67,"w":"resilient","fa":"تاب‌آور، مقاوم","syn":"adaptable","pos":"adj","example":"Resilient communities recover after disasters.","translation":"جوامع تاب‌آور پس از بلایا بهبود می‌یابند.","lesson":4,"day":12,"week":3},{"id":179,"w":"erratic","fa":"بی‌ثبات، نامنظم","syn":"irregular","pos":"adj","example":"The machine showed erratic behavior.","translation":"دستگاه رفتار نامنظمی نشان داد.","lesson":11,"day":12,"week":3},{"id":71,"w":"blur","fa":"محو کردن، تار شدن","syn":"obscure","pos":"v","example":"Heavy rain can blur the image.","translation":"باران شدید می‌تواند تصویر را تار کند.","lesson":5,"day":12,"week":3},{"id":20,"w":"agile","fa":"چابک","syn":"nimble","pos":"adj","example":"The agile athlete changed direction quickly.","translation":"ورزشکار چابک به‌سرعت جهت خود را عوض کرد.","lesson":2,"day":12,"week":3},{"id":206,"w":"crucial","fa":"بسیار مهم، حیاتی","syn":"critical","pos":"adj","example":"Preparation is crucial for exam success.","translation":"آمادگی برای موفقیت در امتحان حیاتی است.","lesson":13,"day":12,"week":3},{"id":162,"w":"genuine","fa":"واقعی، اصیل","syn":"authentic","pos":"adj","example":"The museum confirmed the painting was genuine.","translation":"موزه اصالت تابلو را تأیید کرد.","lesson":10,"day":12,"week":3},{"id":234,"w":"indiscriminate","fa":"بی‌تمایز، بدون گزینش","syn":"random","pos":"adj","example":"Indiscriminate use of chemicals is harmful.","translation":"استفاده بی‌رویه و بدون گزینش از مواد شیمیایی زیان‌آور است.","lesson":14,"day":12,"week":3},{"id":118,"w":"simultaneous","fa":"هم‌زمان","syn":"concurrent","pos":"adj","example":"Two simultaneous events caused delays.","translation":"دو رویداد هم‌زمان باعث تأخیر شدند.","lesson":7,"day":12,"week":3},{"id":232,"w":"function","fa":"کارکرد؛ عمل کردن","syn":"role","pos":"n/v","example":"Every part has a specific function.","translation":"هر بخش کارکرد مشخصی دارد.","lesson":14,"day":12,"week":3},{"id":57,"w":"concur","fa":"موافق بودن، هم‌نظر بودن","syn":"agree","pos":"v","example":"Most researchers concur with this view.","translation":"بیشتر پژوهشگران با این دیدگاه موافق‌اند.","lesson":4,"day":12,"week":3},{"id":282,"w":"impartial","fa":"بی‌طرف","syn":"unbiased","pos":"adj","example":"An impartial reviewer assessed the work.","translation":"داوری بی‌طرف اثر را ارزیابی کرد.","lesson":17,"day":13,"week":3},{"id":217,"w":"offensive","fa":"توهین‌آمیز؛ زننده","syn":"insulting","pos":"adj","example":"The comment was offensive to listeners.","translation":"اظهارنظر بر :3},{"id":209,"w":"exhaust","fa":"تمام کردن، فرسوده کردن","syn":"deplete","pos":"v","example":"Long work hours can exhaust employees.","translation":"ساعت‌های طولانی کار می‌تواند کارکنان را فرسوده کند.","lesson":13,"day":14,"week":3},{"id":224,"w":"arid","fa":"خشک، کم‌آب","syn":"dry","pos":"adj","example":"Few plants survive in an arid climate.","translation":"گیاهان کمی در آب‌وهوای خشک زنده می‌مانند.","lesson":14,"day":14,"week":3},{"id":134,"w":"obtain","fa":"به دست آوردن","syn":"acquire","pos":"v","example":"Researchers obtain data from surveys.","translation":"پژوهشگران داده‌ها را از نظرسنجی‌ها به دست می‌آورند.","lesson":8,"day":14,"week":3},{"id":124,"w":"dictate","fa":"تعیین کردن، دیکته کردن","syn":"determine","pos":"v","example":"The weather may dictate our schedule.","translation":"آب‌وهوا ممکن است برنامه ما را تعیین کند.","lesson":8,"day":14,"week":3},{"id":170,"w":"vigorous","fa":"نیرومند، پرشدت","syn":"energetic","pos":"adj","example":"The proposal led to vigorous debate.","translation":"پیشنهاد به بحثی پرشور منجر شد.","lesson":10,"day":14,"week":3},{"id":96,"w":"immense","fa":"عظیم، بسیار بزرگ","syn":"enormous","pos":"adj","example":"The discovery had immense significance.","translation":"این کشف اهمیت بسیار زیادی داشت.","lesson":6,"day":14,"week":3},{"id":188,"w":"benefit","fa":"سود، فایده؛ سود رساندن","syn":"advantage","pos":"n/v","example":"Regular revision can benefit all learners.","translation":"مرور منظم می‌تواند برای همه زبان‌آموزان مفید باشد.","lesson":12,"day":14,"week":3},{"id":168,"w":"stoic","fa":"خویشتن‌دار در برابر سختی","syn":"unemotional","pos":"adj","example":"He remained stoic despite the difficulties.","translation":"او با وجود سختی‌ها خویشتن‌دار ماند.","lesson":10,"day":14,"week":3},{"id":255,"w":"conscientious","fa":"وظیفه‌شناس، دقیق","syn":"meticulous","pos":"adj","example":"The conscientious assistant checked every detail.","translation":"دستیار وظیفه‌شناس همه جزئیات را بررسی کرد.","lesson":16,"day":14,"week":3},{"id":14,"w":"persistent","fa":"مداوم، پیگیر","syn":"continuous","pos":"adj","example":"Persistent effort is essential for progress.","translation":"تلاش پیگیر برای پیشرفت ضروری است.","lesson":1,"day":15,"week":3},{"id":113,"w":"eventually","fa":"سرانجام، در نهایت","syn":"ultimately","pos":"adv","example":"The team eventually reached an agreement.","translation":"گروه سرانجام به توافق رسید.","lesson":7,"day":15,"week":3},{"id":149,"w":"jargon","fa":"اصطلاحات تخصصی","syn":"technical language","pos":"n","example":"The report uses too much scientific jargon.","translation":"گزارش بیش‌ازحد از اصطلاحات تخصصی علمی استفاده می‌کند.","lesson":9,"day":15,"week":3},{"id":156,"w":"dormant","fa":"خفته، غیرفعال","syn":"inactive","pos":"adj","example":"The volcano remained dormant for centuries.","translation":"آتشفشان قرن‌ها خفته باقی ماند.","lesson":10,"day":15,"week":3},{"id":130,"w":"harvest","fa":"برداشت محصول","syn":"gather","pos":"v/n","example":"Farmers harvest wheat in early summer.","translation":"کشاورزان در اوایل تابستان گندم برداشت می‌کنند.","lesson":8,"day":15,"week":3},{"id":213,"w":"idol","fa":"بت، فرد مورد ستایش","syn":"hero","pos":"n","example":"The musician became an idol to many fans.","translation":"آن موسیقی‌دان محبوب و الگوی بسیاری از طرفداران شد.","lesson":13,"day":15,"week":3},{"id":219,"w":"suitable","fa":"مناسب","syn":"appropriate","pos":"adj","example":"This material is suitable for outdoor use.","translation":"این ماده برای استفاده در فضای باز مناسب است.","lesson":13,"day":15,"week":3},{"id":24,"w":"circumvent","fa":"دور زدن، اجتناب زیرکانه","syn":"bypass","pos":"v","example":"The team found a way to circumvent the obstacle.","translation":"گروه راهی برای دور زدن مانع پیدا کرد.","lesson":2,"day":15,"week":3},{"id":222,"w":"ample","fa":"فراوان، کافی و بیشتر از نیاز","syn":"plentiful","pos":"adj","example":"There is ample evidence for the conclusion.","translation":"شواهد فراوانی برای نتیجه‌گیری وجود دارد.","lesson":14,"day":15,"week":3},{"id":70,"w":"bear","fa":"به بار آوردن؛ تحمل کردن","syn":"produce","pos":"v","example":"Some plants bear fruit in early summer.","translation":"برخی گیاهان در اوایل تابستان میوه می‌دهند.","lesson":5,"day":15,"week":3},{"id":252,"w":"substantial","fa":"قابل توجه، چشمگیر","syn":"significant","pos":"adj","example":"The study found a substantial improvement.","translation":"مطالعه بهبودی قابل توجه نشان داد.","lesson":15,"day":16,"week":4},{"id":7,"w":"attractive","fa":"جذاب","syn":"appealing","pos":"adj","example":"The university offers attractive research opportunities.","translation":"دانشگاه فرصت‌های پژوهشی جذابی ارائه می‌دهد.","lesson":1,"day":16,"week":4},{"id":195,"w":"eloquent","fa":"شیوا، رسا","syn":"articulate","pos":"adj","example":"She gave an eloquent speech.","translation":"او سخنرانی شیوایی ارائه داد.","lesson":12,"day":16,"week":4},{"id":89,"w":"complex","fa":"پیچیده","syn":"complicated","pos":"adj","example":"The process involves complex reactions.","translation":"این فرایند شامل واکنش‌های پیچیده است.","lesson":6,"day":16,"week":4},{"id":216,"w":"obviously","fa":"آشکارا، بدیهی است که","syn":"clearly","pos":"adv","example":"The solution is obviously more efficient.","translation":"این راه‌حل آشکارا کارآمدتر است.","lesson":13,"day":16,"week":4},{"id":99,"w":"routinely","fa":"به‌طور معمول و منظم","syn":"regularly","pos":"adv","example":"The samples are routinely inspected.","translation":"نمونه‌ها به‌طور منظم بازرسی می‌شوند.","lesson":6,"day":16,"week":4},{"id":36,"w":"analyze","fa":"تجزیه و تحلیل کردن","syn":"examine","pos":"v","example":"Scientists analyze the samples carefully.","translation":"دانشمندان نمونه‌ها را با دقت تحلیل می‌کنند.","lesson":3,"day":16,"week":4},{"id":233,"w":"fundamental","fa":"اساسی، بنیادی","syn":"basic","pos":"adj","example":"Critical thinking is a fundamental skill.","translation":"تفکر انتقادی یک مهارت بنیادی است.","lesson":14,"day":16,"week":4},{"id":84,"w":"well-suited","fa":"بسیار مناسب","syn":"appropriate","pos":"adj","example":"The method is well-suited to small samples.","translation":"این روش برای نمونه‌های کوچک بسیار مناسب است.","lesson":5,"day":16,"week":4},{"id":277,"w":"discreetly","fa":"محتاطانه، با حفظ رازداری","syn":"tactfully","pos":"adv","example":"She discreetly asked about the issue.","translation":"او با احتیاط و رازداری درباره موضوع پرسید.","lesson":17,"day":16,"week":4},{"id":152,"w":"uniform","fa":"یکنواخت، یکسان","syn":"consistent","pos":"adj","example":"The samples had a uniform shape.","translation":"نمونه‌ها شکلی یکسان داشتند.","lesson":9,"day":17,"week":4},{"id":27,"w":"distribute","fa":"توزیع کردن","syn":"dispense","pos":"v","example":"The teacher will distribute the materials.","translation":"معلم مطالب را توزیع خواهد کرد.","lesson":2,"day":17,"week":4},{"id":166,"w":"rudimentary","fa":"ابتدایی، مقدماتی","syn":"basic","pos":"adj","example":"The course teaches rudimentary grammar.","translation":"دوره گرامر مقدماتی آموزش می‌دهد.","lesson":10,"day":17,"week":4},{"id":185,"w":"precipitate","fa":"باعث شدن، ناگهانی آغاز کردن","syn":"trigger","pos":"v","example":"A sudden drop in prices may precipitate a crisis.","translation":"کاهش ناگهانی قیمت‌ها ممکن است بحرانی ایجاد کند.","lesson":11,"day":17,"week":4},{"id":176,"w":"emerge","fa":"ظاهر شدن، پدیدار شدن","syn":"appear","pos":"v","example":"A new pattern began to emerge.","translation":"الگوی جدیدی شروع به پدیدارشدن کرد.","lesson":11,"day":17,"week":4},{"id":117,"w":"scarcely","fa":"به‌سختی، تقریباً نه","syn":"barely","pos":"adv","example":"We could scarcely hear the speaker.","translation":"به‌سختی می‌توانستیم صدای سخنران را بشنویم.","lesson":7,"day":17,"week":4},{"id":137,"w":"account for","fa":"توضیح دادن؛ سهم داشتن","syn":"explain","pos":"ph.v","example":"These factors account for the change.","translation":"این عوامل تغییر را توضیح می‌دهند.","lesson":9,"day":17,"week":4},{"id":193,"w":"conspicuously","fa":"به‌شکلی جلب‌توجه‌کننده","syn":"noticeably","pos":"adv","example":"One figure was conspicuously absent.","translation":"یک عدد به‌طرز محسوسی وجود نداشت.","lesson":12,"day":17,"week":4},{"id":132,"w":"mirror","fa":"بازتاب دادن","syn":"reflect","pos":"v","example":"The results mirror earlier findings.","translation":"نتایج بازتاب‌دهنده یافته‌های پیشین‌اند.","lesson":8,"day":17,"week":4},{"id":94,"w":"exclusively","fa":"منحصراً","syn":"solely","pos":"adv","example":"The laboratory is used exclusively for research.","translation":"آزمایشگاه منحصراً برای پژوهش استفاده می‌شود.","lesson":6,"day":17,"week":4},{"id":119,"w":"theoretically","fa":"از نظر نظری","syn":"in theory","pos":"adv","example":"Theoretically, the plan should work.","translation":"از نظر نظری این طرح باید جواب بدهد.","lesson":7,"day":18,"week":4},{"id":161,"w":"exceptional","fa":"استثنایی، فوق‌العاده","syn":"outstanding","pos":"adj","example":"Her exceptional performance earned praise.","translation":"عملکرد استثنایی او تحسین برانگیخت.","lesson":10,"day":18,"week":4},{"id":187,"w":"release","fa":"آزاد کردن، منتشر کردن","syn":"free","pos":"v","example":"The laboratory will release its results tomorrow.","translation":"آزمایشگاه نتایجش را فردا منتشر خواهد کرد.","lesson":11,"day":18,"week":4},{"id":64,"w":"mundane","fa":"معمولی، پیش‌پاافتاده","syn":"ordinary","pos":"adj","example":"Even mundane tasks require attention.","translation":"حتی کارهای پیش‌پاافتاده هم به توجه نیاز دارند.","lesson":4,"day":18,"week":4},{"id":78,"w":"intrigue","fa":"کنجکاو کردن، مجذوب کردن","syn":"fascinate","pos":"v","example":"The mystery may intrigue young readers.","translation":"این معما ممکن است خوانندگان جوان را کنجکاو کند.","lesson":5,"day":18,"week":4},{"id":231,"w":"freshly","fa":"به‌تازگی","syn":"recently","pos":"adv","example":"Freshly collected samples were analyzed.","translation":"نمونه‌های تازه جمع‌آوری‌شده تحلیل شدند.","lesson":14,"day":18,"week":4},{"id":18,"w":"advantage","fa":"مزیت، برتری","syn":"benefit","pos":"n","example":"Online classes have one clear advantage: flexibility.","translation":"کلاس‌های آنلاین یک مزیت روشن دارند: انعطاف‌پذیری.","lesson":2,"day":18,"week":4},{"id":90,"w":"conventional","fa":"مرسوم، سنتی","syn":"traditional","pos":"adj","example":"Conventional methods often take longer.","translation":"روش‌های مرسوم اغلب زمان بیشتری می‌برند.","lesson":6,"day":18,"week":4},{"id":226,"w":"defy","fa":"سرپیچی کردن، به چالش کشیدن","syn":"challenge","pos":"v","example":"The findings seem to defy explanation.","translation":"به نظر می‌رسد یافته‌ها توضیح‌پذیر نباشند.","lesson":14,"day":18,"week":4},{"id":138,"w":"accurate","fa":"دقیق، درست","syn":"precise","pos":"adj","example":"Accurate measurements are essential.","translation":"اندازه‌گیری‌های دقیق ضروری‌اند.","lesson":9,"day":18,"week":4},{"id":50,"w":"turbulent","fa":"متلاطم، آشفته","syn":"chaotic","pos":"adj","example":"The aircraft crossed a turbulent region.","translation":"هواپیما از منطقه‌ای متلاطم عبور کرد.","lesson":3,"day":19,"week":4},{"id":262,"w":"inevitable","fa":"اجتناب‌ناپذیر","syn":"unavoidable","pos":"adj","example":"Some delays are inevitable in large projects.","translation":"برخی تأخیرها در پروژه‌های بزرگ اجتناب‌ناپذیرند.","lesson":16,"day":19,"week":4},{"id":61,"w":"elicit","fa":"بیرون کشیدن، برانگیختن پاسخ","syn":"draw out","pos":"v","example":"The question may elicit useful information.","translation":"این پرسش ممکن است اطلاعات مفیدی به دست دهد.","lesson":4,"day":19,"week":4},{"id":164,"w":"minuscule","fa":"بسیار کوچک، ناچیز","syn":"tiny","pos":"adj","example":"The device contains minuscule components.","translation":"دستگاه اجزای بسیار کوچکی دارد.","lesson":10,"day":19,"week":4},{"id":218,"w":"predictably","fa":"طبق انتظار، قابل پیش‌بینی","syn":"expectedly","pos":"adv","example":"Predictably, demand rose during winter.","translation":"طبق انتظار تقاضا در زمستان افزایش یافت.","lesson":13,"day":19,"week":4},{"id":104,"w":"clarify","fa":"روشن کردن، توضیح دادن","syn":"explain","pos":"v","example":"Please clarify the purpose of the study.","translation":"لطفاً هدف مطالعه را روشن کنید.","lesson":7,"day":19,"week":4},{"id":43,"w":"enrich","fa":"غنی کردن","syn":"enhance","pos":"v","example":"Reading widely can enrich your vocabulary.","translation":"مطالعه گسترده می‌تواند دایره واژگانت را غنی کند.","lesson":3,"day":19,"week":4},{"id":158,"w":"dramatic","fa":"چشمگیر، شدید","syn":"striking","pos":"adj","example":"The experiment produced a dramatic change.","translation":"آزمایش تغییری چشمگیر ایجاد کرد.","lesson":10,"day":19,"week":4},{"id":225,"w":"avert","fa":"جلوگیری کردن، دور کردن","syn":"prevent","pos":"v","example":"The new system may avert accidents.","translation":"سیستم جدید ممکن است از حوادث جلوگیری کند.","lesson":14,"day":19,"week":4},{"id":103,"w":"brash","fa":"گستاخ، بی‌پروا","syn":"reckless","pos":"adj","example":"His brash comments upset the audience.","translation":"اظهارنظرهای گستاخانه او مخاطبان را ناراحت کرد.","lesson":7,"day":19,"week":4},{"id":189,"w":"blind","fa":"نابینا؛ ناآگاه","syn":"unaware","pos":"adj","example":"They were blind to the warning signs.","translation":"آن‌ها نسبت به نشانه‌های هشدار بی‌توجه بودند.","lesson":12,"day":20,"week":4},{"id":266,"w":"proficient","fa":"ماهر، مسلط","syn":"competent","pos":"adj","example":"She is proficient in academic English.","translation":"او به انگلیسی دانشگاهی مسلط است.","lesson":16,"day":20,"week":4},{"id":175,"w":"eliminate","fa":"حذف کردن","syn":"remove","pos":"v","example":"New measures aim to eliminate errors.","translation":"اقدامات جدید با هدف حذف خطاها انجام می‌شوند.","lesson":11,"day":20,"week":4},{"id":121,"w":"crush","fa":"خرد کردن، له کردن","syn":"compress","pos":"v","example":"The machine can crush hard rocks.","translation":"دستگاه می‌تواند سنگ‌های سخت را خرد کند.","lesson":8,"day":20,"week":4},{"id":273,"w":"agitate","fa":"آشفته کردن، تحریک کردن","syn":"disturb","pos":"v","example":"Uncertain news can agitate investors.","translation":"خبرهای نامطمئن می‌توانند سرمایه‌گذاران را آشفته کنند.","lesson":17,"day":20,"week":4},{"id":283,"w":"inordinate","fa":"بیش‌ازحد، نامتناسب","syn":"excessive","pos":"adj","example":"The project required an inordinate amount of time.","translation":"پروژه زمان بیش‌ازحدی نیاز داشت.","lesson":17,"day":20,"week":4},{"id":58,"w":"deceptively","fa":"به‌شکلی فریبنده","syn":"misleadingly","pos":"adv","example":"The task looked deceptively simple.","translation":"کار به‌ظاهر و به‌شکلی فریبنده ساده بود.","lesson":4,"day":20,"week":4},{"id":205,"w":"accolade","fa":"افتخار، تقدیر","syn":"honor","pos":"n","example":"The author received an accolade for the book.","translation":"نویسنده بابت کتاب تقدیر شد.","lesson":13,"day":20,"week":4},{"id":182,"w":"justify","fa":"توجیه کردن، دلیل آوردن","syn":"defend","pos":"v","example":"The author must justify the conclusion.","translation":"نویسنده باید نتیجه‌گیری را توجیه کند.","lesson":11,"day":20,"week":4},{"id":247,"w":"mysterious","fa":"مرموز، رازآلود","syn":"puzzling","pos":"adj","example":"The researchers observed a mysterious pattern.","translation":"پژوهشگران الگویی مرموز مشاهده کردند.","lesson":15,"day":20,"week":4},{"id":46,"w":"ongoing","fa":"در حال انجام، مستمر","syn":"continuing","pos":"adj","example":"The ongoing project requires more time.","translation":"پروژه در حال اجرا به زمان بیشتری نیاز دارد.","lesson":3,"day":21,"week":5},{"id":76,"w":"incessant","fa":"بی‌وقفه، مداوم","syn":"constant","pos":"adj","example":"Incessant noise reduced concentration.","translation":"صدای بی‌وقفه تمرکز را کاهش داد.","lesson":5,"day":21,"week":5},{"id":143,"w":"dim","fa":"کم‌نور، محو","syn":"faint","pos":"adj","example":"The stars looked dim through the clouds.","translation":"ستارگان از میان ابرها کم‌نور به نظر می‌رسیدند.","lesson":9,"day":21,"week":5},{"id":25,"w":"collide","fa":"برخورد کردن","syn":"crash","pos":"v","example":"Two competing ideas may collide in a debate.","translation":"دو دیدگاه رقیب ممکن است در یک مناظره با هم برخورد کنند.","lesson":2,"day":21,"week":5},{"id":229,"w":"feign","fa":"وانمود کردن، تظاهر کردن","syn":"pretend","pos":"v","example":"The actor had to feign surprise.","translation":"بازیگر مجبور بود تظاهر به تعجب کند.","lesson":14,"day":21,"week":5},{"id":280,"w":"evoke","fa":"برانگیختن، تداعی کردن","syn":"arouse","pos":"v","example":"The photograph can evoke strong memories.","translation":"عکس می‌تواند خاطرات قوی را برانگیزد.","lesson":17,"day":21,"week":5},{"id":203,"w":"shift","fa":"تغییر جهت دادن؛ جابه‌جایی","syn":"change","pos":"v/n","example":"Attitudes shift over time.","translation":"نگرش‌ها در گذر زمان تغییر می‌کنند.","lesson":12,"day":21,"week":5},{"id":199,"w":"erode","fa":"فرسایش دادن، تحلیل بردن","syn":"wear away","pos":"v","example":"Running water can erode the rock.","translation":"آب جاری می‌تواند سنگ را فرسایش دهد.","lesson":12,"day":21,"week":5},{"id":39,"w":"anticipate","fa":"پیش‌بینی کردن، انتظار داشتن","syn":"predict","pos":"v","example":"Experts anticipate higher demand next year.","translation":"کارشناسان تقاضای بیشتری را در سال آینده پیش‌بینی می‌کنند.","lesson":3,"day":21,"week":5},{"id":153,"w":"vibrant","fa":"پرانرژی، پویا","syn":"lively","pos":"adj","example":"The city has a vibrant cultural scene.","translation":"این شهر فضای فرهنگی پویایی دارد.","lesson":9,"day":21,"week":5},{"id":140,"w":"classify","fa":"طبقه‌بندی کردن","syn":"categorize","pos":"v","example":"Scientists classify species by their traits.","translation":"دانشمندان گونه‌ها را بر اساس ویژگی‌هایشان طبقه‌بندی می‌کنند.","lesson":9,"day":22,"week":5},{"id":196,"w":"endorse","fa":"تأیید و حمایت کردن","syn":"support","pos":"v","example":"The committee will endorse the proposal.","translation":"کمیته از این پیشنهاد حمایت خواهد کرد.","lesson":12,"day":22,"week":5},{"id":135,"w":"particle","fa":"ذره","syn":"speck","pos":"n","example":"Each particle was examined under a microscope.","translation":"هر ذره زیر میکروسکوپ بررسی شد.","lesson":8,"day":22,"week":5},{"id":2,"w":"abrupt","fa":"ناگهانی، غیرمنتظره","syn":"sudden","pos":"adj","example":"The meeting came to an abrupt end.","translation":"جلسه به شکلی ناگهانی پایان یافت.","lesson":1,"day":22,"week":5},{"id":123,"w":"derive","fa":"به دست آوردن، منشأ گرفتن","syn":"obtain","pos":"v","example":"We derive the formula from basic principles.","translation":"فرمول را از اصول پایه به دست می‌آوریم.","lesson":8,"day":22,"week":5},{"id":286,"w":"inundate","fa":"غرق کردن، سرازیرشدن به سوی","syn":"flood","pos":"v","example":"Heavy rain may inundate low areas.","translation":"باران شدید ممکن است مناطق پست را زیر آب ببرد.","lesson":17,"day":22,"week":5},{"id":236,"w":"selective","fa":"گزینشی","syn":"discriminating","pos":"adj","example":"The program uses selective criteria.","translation":"برنامه از معیارهای گزینشی استفاده می‌کند.","lesson":14,"day":22,"week":5},{"id":51,"w":"vital","fa":"حیاتی، ضروری","syn":"essential","pos":"adj","example":"Water is vital for human survival.","translation":"آب برای بقای انسان حیاتی است.","lesson":3,"day":22,"week":5},{"id":66,"w":"relinquish","fa":"واگذار کردن، دست کشیدن","syn":"give up","pos":"v","example":"She refused to relinquish control.","translation":"او از واگذار کردن کنترل خودداری کرد.","lesson":4,"day":22,"week":5},{"id":287,"w":"mindset","fa":"طرز فکر، نگرش","syn":"attitude","pos":"n","example":"A positive mindset helps during exams.","translation":"نگرش مثبت هنگام امتحان کمک می‌کند.","lesson":17,"day":22,"week":5},{"id":173,"w":"element","fa":"عنصر، بخش تشکیل‌دهنده","syn":"component","pos":"n","example":"Trust is an important element of teamwork.","translation":"اعتماد یکی از عناصر مهم کار گروهی است.","lesson":11,"day":23,"week":5},{"id":131,"w":"mammoth","fa":"غول‌آسا","syn":"huge","pos":"adj","example":"The project required a mammoth effort.","translation":"پروژه به تلاشی عظیم نیاز داشت.","lesson":8,"day":23,"week":5},{"id":11,"w":"disruptive","fa":"مختل‌کننده","syn":"disturbing","pos":"adj","example":"Disruptive noise made studying difficult.","translation":"صدای مختل‌کننده مطالعه را دشوار کرد.","lesson":1,"day":23,"week":5},{"id":271,"w":"zenith","fa":"اوج، بالاترین نقطه","syn":"peak","pos":"n","example":"Her career reached its zenith in that d
