بود.","lesson":13,"day":27,"week":6},{"id":239,"w":"adept","fa":"ماهر، چیره‌دست","syn":"skilled","pos":"adj","example":"She is adept at solving difficult problems.","translation":"او در حل مسئله‌های دشوار مهارت دارد.","lesson":15,"day":27,"week":6},{"id":241,"w":"foster","fa":"پرورش دادن، تقویت کردن","syn":"nurture","pos":"v","example":"Good teachers foster curiosity.","translation":"معلمان خوب کنجکاوی را پرورش می‌دهند.","lesson":15,"day":27,"week":6},{"id":270,"w":"unwarranted","fa":"بی‌دلیل، ناموجه","syn":"unjustified","pos":"adj","example":"The criticism was harsh and unwarranted.","translation":"انتقاد تند و ناموجه بود.","lesson":16,"day":27,"week":6},{"id":23,"w":"celebrated","fa":"مشهور، نامدار","syn":"renowned","pos":"adj","example":"A celebrated scientist delivered the lecture.","translation":"دانشمندی نامدار سخنرانی را ارائه کرد.","lesson":2,"day":27,"week":6},{"id":186,"w":"prevalent","fa":"شایع، رایج","syn":"widespread","pos":"adj","example":"This belief is prevalent among adults.","translation":"این باور در میان بزرگسالان رایج است.","lesson":11,"day":27,"week":6},{"id":101,"w":"sufficiently","fa":"به‌اندازه کافی","syn":"adequately","pos":"adv","example":"The evidence was sufficiently strong.","translation":"شواهد به‌اندازه کافی قوی بود.","lesson":6,"day":27,"week":6},{"id":163,"w":"hazardous","fa":"خطرناک","syn":"dangerous","pos":"adj","example":"Hazardous chemicals require careful storage.","translation":"مواد شیمیایی خطرناک به نگهداری دقیق نیاز دارند.","lesson":10,"day":27,"week":6},{"id":112,"w":"diverse","fa":"متنوع","syn":"varied","pos":"adj","example":"The class includes students from diverse backgrounds.","translation":"کلاس شامل دانشجویانی با پیشینه‌های متنوع است.","lesson":7,"day":27,"week":6},{"id":35,"w":"alter","fa":"تغییر دادن","syn":"modify","pos":"v","example":"Small errors may alter the final result.","translation":"خطاهای کوچک ممکن است نتیجه نهایی را تغییر دهند.","lesson":3,"day":27,"week":6},{"id":249,"w":"promote","fa":"ترویج کردن، ارتقا دادن","syn":"encourage","pos":"v","example":"The campaign aims to promote healthy habits.","translation":"این کارزار به دنبال ترویج عادت‌های سالم است.","lesson":15,"day":28,"week":6},{"id":151,"w":"straightforward","fa":"ساده و سرراست","syn":"simple","pos":"adj","example":"The instructions are straightforward.","translation":"دستورالعمل‌ها ساده و روشن‌اند.","lesson":9,"day":28,"week":6},{"id":294,"w":"culminate","fa":"به اوج رسیدن؛ پایان یافتن به","syn":"conclude","pos":"v","example":"Months of work culminate in a final report.","translation":"ماه‌ها کار به یک گزارش نهایی منتهی می‌شود.","lesson":18,"day":28,"week":6},{"id":54,"w":"assert","fa":"با قاطعیت بیان کردن","syn":"declare","pos":"v","example":"The author will assert the main claim.","translation":"نویسنده ادعای اصلی را با قاطعیت بیان خواهد کرد.","lesson":4,"day":28,"week":6},{"id":299,"w":"intuition","fa":"شهود، دریافت درونی","syn":"instinct","pos":"n","example":"Intuition alone is not enough for research.","translation":"شهود به‌تنهایی برای پژوهش کافی نیست.","lesson":18,"day":28,"week":6},{"id":258,"w":"expansion","fa":"گسترش، توسعه","syn":"growth","pos":"n","example":"The expansion of the network took years.","translation":"گسترش شبکه سال‌ها طول کشید.","lesson":16,"day":28,"week":6},{"id":250,"w":"redundant","fa":"زائد، تکراری غیرضروری","syn":"unnecessary","pos":"adj","example":"Delete redundant sentences from the report.","translation":"جمله‌های تکراری و زائد را از گزارش حذف کن.","lesson":15,"day":28,"week":6},{"id":72,"w":"brilliant","fa":"درخشان، بسیار هوشمندانه","syn":"outstanding","pos":"adj","example":"She presented a brilliant solution.","translation":"او راه‌حلی درخشان ارائه کرد.","lesson":5,"day":28,"week":6},{"id":144,"w":"display","fa":"نمایش دادن","syn":"show","pos":"v","example":"The chart will display the results.","translation":"نمودار نتایج را نمایش خواهد داد.","lesson":9,"day":28,"week":6},{"id":300,"w":"lack","fa":"کمبود، نداشتن","syn":"shortage","pos":"n/v","example":"A lack of sleep can reduce attention.","translation":"کمبود خواب می‌تواند توجه را کاهش دهد.","lesson":18,"day":28,"week":6},{"id":183,"w":"mortify","fa":"بسیار خجالت‌زده کردن","syn":"humiliate","pos":"v","example":"The public mistake could mortify a speaker.","translation":"اشتباه علنی می‌تواند سخنران را بسیار خجالت‌زده کند.","lesson":11,"day":29,"week":6},{"id":95,"w":"extinguish","fa":"خاموش کردن","syn":"put out","pos":"v","example":"Firefighters worked to extinguish the flames.","translation":"آتش‌نشانان برای خاموش کردن شعله‌ها تلاش کردند.","lesson":6,"day":29,"week":6},{"id":290,"w":"allocation","fa":"تخصیص، سهم‌بندی","syn":"distribution","pos":"n","example":"The allocation of funds was transparent.","translation":"تخصیص بودجه شفاف بود.","lesson":18,"day":29,"week":6},{"id":190,"w":"broaden","fa":"گسترش دادن","syn":"expand","pos":"v","example":"Travel can broaden your perspective.","translation":"سفر می‌تواند دیدگاهت را گسترش دهد.","lesson":12,"day":29,"week":6},{"id":146,"w":"gigantic","fa":"غول‌پیکر","syn":"enormous","pos":"adj","example":"A gigantic wave struck the coast.","translation":"موجی غول‌پیکر به ساحل برخورد کرد.","lesson":9,"day":29,"week":6},{"id":13,"w":"intervention","fa":"مداخله","syn":"involvement","pos":"n","example":"Early intervention improved the results.","translation":"مداخله زودهنگام نتایج را بهتر کرد.","lesson":1,"day":29,"week":6},{"id":198,"w":"entirely","fa":"کاملاً، به‌طور کامل","syn":"completely","pos":"adv","example":"The two methods are entirely different.","translation":"این دو روش کاملاً متفاوت‌اند.","lesson":12,"day":29,"week":6},{"id":155,"w":"dominant","fa":"غالب، مسلط","syn":"prevailing","pos":"adj","example":"English became the dominant language of the field.","translation":"انگلیسی زبان غالب این حوزه شد.","lesson":10,"day":29,"week":6},{"id":15,"w":"postpone","fa":"به تعویق انداختن","syn":"delay","pos":"v","example":"The organizers decided to postpone the seminar.","translation":"برگزارکنندگان تصمیم گرفتند همایش را به تعویق بیندازند.","lesson":1,"day":29,"week":6},{"id":275,"w":"confidential","fa":"محرمانه","syn":"secret","pos":"adj","example":"Please keep this information confidential.","translation":"لطفاً این اطلاعات را محرمانه نگه دار.","lesson":17,"day":29,"week":6},{"id":92,"w":"emit","fa":"منتشر کردن، ساطع کردن","syn":"release","pos":"v","example":"Some materials emit harmful gases.","translation":"برخی مواد گازهای زیان‌آور منتشر می‌کنند.","lesson":6,"day":30,"week":6},{"id":126,"w":"docile","fa":"مطیع، رام","syn":"obedient","pos":"adj","example":"The docile animal followed its trainer.","translation":"حیوان رام از مربی خود پیروی کرد.","lesson":8,"day":30,"week":6},{"id":254,"w":"underscore","fa":"تأکید کردن، برجسته ساختن","syn":"highlight","pos":"v","example":"The findings underscore the need for change.","translation":"یافته‌ها بر نیاز به تغییر تأکید می‌کنند.","lesson":15,"day":30,"week":6},{"id":12,"w":"haphazardly","fa":"بی‌برنامه، تصادفی","syn":"randomly","pos":"adv","example":"The files were arranged haphazardly.","translation":"پرونده‌ها به‌شکلی بی‌نظم چیده شده بودند.","lesson":1,"day":30,"week":6},{"id":68,"w":"stagnant","fa":"راکد، بی‌تحرک","syn":"inactive","pos":"adj","example":"The economy remained stagnant for years.","translation":"اقتصاد سال‌ها راکد ماند.","lesson":4,"day":30,"week":6},{"id":8,"w":"autonomous","fa":"مستقل، خودمختار","syn":"independent","pos":"adj","example":"The region became an autonomous province.","translation":"این منطقه به استانی خودمختار تبدیل شد.","lesson":1,"day":30,"week":6},{"id":106,"w":"confirm","fa":"تأیید کردن","syn":"verify","pos":"v","example":"The new findings confirm the hypothesis.","translation":"یافته‌های جدید فرضیه را تأیید می‌کنند.","lesson":7,"day":30,"week":6},{"id":261,"w":"inadvertently","fa":"سهواً، ناخواسته","syn":"accidentally","pos":"adv","example":"She inadvertently deleted the document.","translation":"او ناخواسته سند را حذف کرد.","lesson":16,"day":30,"week":6},{"id":298,"w":"feasible","fa":"امکان‌پذیر، عملی","syn":"practical","pos":"adj","example":"The proposed schedule is feasible.","translation":"برنامه پیشنهادی عملی و امکان‌پذیر است.","lesson":18,"day":30,"week":6},{"id":197,"w":"enormous","fa":"بسیار بزرگ، عظیم","syn":"huge","pos":"adj","example":"The study required enormous effort.","translation":"مطالعه به تلاشی عظیم نیاز داشت.","lesson":12,"day":30,"week":6}]</script>
<script>
'use strict';
const VOCAB=JSON.parse(document.getElementById('vocab-db').textContent);
const TOTAL=VOCAB.length, PER_DAY=10, TOTAL_DAYS=30, STORE='msrt_vocab_300_v1';
const WORD_BY_ID=Object.fromEntries(VOCAB.map(v=>[String(v.id),v]));
const POS_LABEL={'adj':'صفت','adv':'قید','v':'فعل','n':'اسم','n/v':'اسم / فعل','v/n':'فعل / اسم','ph.v':'فعل عبارتی','phrase':'عبارت','conj':'حرف ربط'};
const $=s=>document.querySelector(s);
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const makeDefault=()=>({v:1,viewed:{},cards:{},favorites:{},daysDone:{},wrongCounts:{},exams:[],settings:{day:1,week:1,theme:'light',autoSpeech:false,showTranslation:true},quiz:null,session:{screen:'home',cardIds:[],cardIndex:0}});
let state=makeDefault(),ui={screen:'home',cardIds:[],cardIndex:0,filter:'all',search:'',libraryTab:'days',result:null,reviewTab:'due'},restoreError=false;
let storageMode=window.MSRTNative&&typeof window.MSRTNative.getState==='function'?'android':'browser';
try {
 let data=null;
 if(storageMode==='android') data=window.MSRTNative.getState();
 if(!data && storageMode!=='android') data=localStorage.getItem(STORE);
 let saved=JSON.parse(data||'null');
 if(saved&&saved.v===1){let def=makeDefault();state={...def,...saved,settings:{...def.settings,...(saved.settings||{})},session:{...def.session,...(saved.session||{})}};}
}catch(e){restoreError=true;console.error('MSRT restore:',e);}
const safeSave=()=>{try{
 state.session={screen:ui.screen,cardIds:ui.cardIds.slice(0,300),cardIndex:ui.cardIndex,cardBack:ui.cardBack||'home',libraryTab:ui.libraryTab,reviewTab:ui.reviewTab};
 const serialized=JSON.stringify(state);
 if(storageMode==='android'){window.MSRTNative.putState(serialized);return true;}
 localStorage.setItem(STORE,serialized);return true;
}catch(e){restoreError=true;console.error('MSRT save:',e);return false;}};
const persianNumber=n=>typeof n==='number'?n.toLocaleString('fa-IR'):String(n).replace(/\d+/g,m=>Number(m).toLocaleString('fa-IR'));
const dayWords=d=>VOCAB.slice((d-1)*10,d*10);
const weekWords=w=>VOCAB.slice((w-1)*50,w*50);
const isSeen=id=>!!state.viewed[id];
const mastered=id=>(state.cards[id]?.level||0)>=3;
const studied=id=>(state.cards[id]?.reps||0)>0;
const reviewedCount=(arr)=>arr.filter(w=>studied(w.id)).length;
const masteredCount=(arr)=>arr.filter(w=>mastered(w.id)).length;
const dueWords=()=>VOCAB.filter(v=>state.cards[v.id]?.due&&state.cards[v.id].due<=Date.now()).sort((a,b)=>(state.cards[a.id]?.due||0)-(state.cards[b.id]?.due||0));
const unresolvedWrong=()=>VOCAB.filter(v=>(state.wrongCounts[v.id]||0)>0&&(state.cards[v.id]?.level||0)<3).sort((a,b)=>(state.wrongCounts[b.id]||0)-(state.wrongCounts[a.id]||0));
const dateFa=ts=>new Date(ts).toLocaleDateString('fa-IR',{year:'numeric',month:'short',day:'numeric'});
const navs=[['home','⌂','خانه'],['plan','▦','برنامه'],['library','▤','واژه‌ها'],['review','⟳','مرور'],['reports','▥','کارنامه'],['settings','⚙','تنظیمات']];
let toastTimer;
function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3500);}
function scrolTop(){scrollTo({top:0,behavior:'instant'});}
function setScreen(s){ui.screen=s;ui.result=null;render();scrolTop();}
function progressBar(n,max){return `<div class="progress" aria-label="پیشرفت ${n} از ${max}"><i style="width:${max?Math.min(100,Math.round(100*n/max)):0}%"></i></div>`;}
function statcard(label,value,hint){return `<div class="statcard"><div class="label">${label}</div><div class="value">${persianNumber(value)}</div><div class="hint">${hint}</div></div>`;}
function actions(){if(state.quiz)return `<button class="btn primary" data-action="resume-quiz">ادامه آزمون ناتمام ←</button>`;return `<button class="btn primary" data-action="study-day" data-day="${state.settings.day}">شروع کارت‌های روز ${persianNumber(state.settings.day)} ←</button><button class="btn outline-white" data-action="quiz-start" data-mode="day" data-day="${state.settings.day}">آزمون روز</button>`;}
function renderNav(){let html=navs.map(([key,ic,label])=>`<button class="navlink ${ui.screen===key?'active':''}" data-action="nav" data-page="${key}">${label}</button>`).join('');$('#desk-nav').innerHTML=html;$('#mobile-nav').innerHTML=navs.map(([k,i,l])=>`<button class="${ui.screen===k?'active':''}" data-action="nav" data-page="${k}"><span class="nicon">${i}</span>${l}</button>`).join('');$('#topstat').textContent=`${persianNumber(masteredCount(VOCAB))} تسلط / ${persianNumber(TOTAL)}`;document.body.classList.toggle('dark',state.settings.theme==='dark');document.body.classList.toggle('focus-mode',['card','quiz','results'].includes(ui.screen));$('#mobile-nav').style.display=['card','quiz','results'].includes(ui.screen)?'none':'';}
function render(){renderNav();let html=ui.screen==='home'?renderHome():ui.screen==='plan'?renderPlan():ui.screen==='library'?renderLibrary():ui.screen==='review'?renderReview():ui.screen==='reports'?renderReports():ui.screen==='settings'?renderSettings():ui.screen==='card'?renderCard():ui.screen==='quiz'?renderQuiz():ui.screen==='results'?renderResults():renderHome();$('#app').innerHTML=html;updateInstallStatus(); if(ui.screen==='library'){let search=$('#wordSearch');if(search){search.value=ui.search;}}safeSave();}
function renderHome(){let d=state.settings.day,w=Math.ceil(d/5),week=weekWords(w),day=dayWords(d),due=dueWords();return `<main class="wrap main"><section class="hero"><div><div class="overline">هدف امروز · هفته ${persianNumber(w)}، روز ${persianNumber(d)}</div><h1>هر روز ۱۰ واژه،<br>یک قدم نزدیک‌تر به MSRT</h1><p>فلش‌کارت با معنی و مثال فارسی، تلفظ انگلیسی، مرور فاصله‌دار و آزمون‌هایی که اشتباهاتت را برای تمرین بعدی نگه می‌دارند.</p><div class="actions">${actions()}</div></div><div class="herostats"><div class="roundstat"><strong>${persianNumber(reviewedCount(day))}/۱۰</strong><small>واژه مطالعه‌شده امروز</small></div><div class="roundstat"><strong>${persianNumber(due.length)}</strong><small>واژه آماده مرور</small></div></div></section>
<section class="install-strip" id="installStrip">
 <div><strong>📲 نصب نسخه کروم روی گوشی</strong><div class="note">بعد از نصب اولیه، فلش‌کارت‌ها و آزمون‌ها بدون اینترنت باز می‌شوند. پیشرفتت خودکار در حافظه همین برنامه ذخیره می‌شود.</div></div>
 <div class="install-actions"><span id="offlineStatus" class="install-status">در حال بررسی آفلاین…</span><button class="btn primary" data-action="install-app" id="homeInstallBtn">＋ نصب روی گوشی</button></div>
 </section>
<section class="cards3">${statcard('لغت مطالعه‌شده',reviewedCount(VOCAB),'از ۳۰۰ واژه')}${statcard('واژگان مسلط',masteredCount(VOCAB),'سطح مرور ۳ به بالا')}${statcard('آزمون‌های ثبت‌شده',state.exams.length,'کارنامه‌های ذخیره‌شده')}</section>
<div class="grid2"><section><div class="section-head"><div><h2>برنامه همین هفته</h2><p>هر روز ۱۰ واژه از حروف گوناگون و درس‌های مختلف</p></div><button class="btn sm" data-action="nav" data-page="plan">همه روزها</button></div><div class="day-grid">${Array.from({length:5},(_,i)=>renderDayButton((w-1)*5+i+1)).join('')}</div><div class="panel" style="margin-top:14px"><div class="flex between"><strong>پیشرفت هفته ${persianNumber(w)}</strong><span class="muted small">${persianNumber(reviewedCount(week))} از ۵۰ واژه</span></div><div style="margin-top:13px">${progressBar(reviewedCount(week),50)}</div><div class="dashboard-actions" style="margin-top:15px"><button class="btn pale sm" data-action="quiz-start" data-mode="week" data-week="${w}">آزمون ۲۰ سؤالی هفته</button><button class="btn sm" data-action="nav" data-page="library">فهرست لغات</button></div></div></section>
<section><div class="section-head"><div><h2>مرور پیشنهادی</h2><p>اول واژه‌های فراموش‌شده را تثبیت کن</p></div></div><div class="panel"><div class="flex between"><strong>نوبت مرور امروز</strong><span class="chip good">${persianNumber(due.length)} کارت</span></div><p class="muted small" style="line-height:2">بر اساس عملکردت، زمان مرور هر واژه به‌صورت خودکار تغییر می‌کند. واژه‌های دشوار زودتر برمی‌گردند.</p>${due.length?`<div class="review-list">${due.slice(0,7).map(x=>`<button class="review-chip ltr" data-action="open-card" data-id="${x.id}">${escapeHTML(x.w)}</button>`).join('')}</div>`:`<div class="tipbox">هنوز کارت سررسیدشده‌ای نداری. وقتی میزان تسلطت را روی فلش‌کارت‌ها ثبت کنی، زمان مرورها اینجا ظاهر می‌شود.</div>`}<button class="btn full" style="margin-top:14px" data-action="review-due">شروع مرور هوشمند</button></div></section></div>
<section><div class="section-head"><div><h2>واژه‌های روز ${persianNumber(d)}</h2><p>روی هر واژه بزن تا صفحه کامل فلش‌کارتش را ببینی</p></div><button class="btn sm" data-action="study-day" data-day="${d}">نمایش فلش‌کارت‌ها</button></div>${day.map((v,i)=>renderWordRow(v,i)).join('')}</section><p class="footnote" style="margin:25px 0 12px">اطلاعات و نمرات روی همین دستگاه ذخیره می‌شوند؛ برای جلوگیری از پاک‌شدن اطلاعات، از بخش تنظیمات فایل پشتیبان بگیر.</p></main>`;}
function renderDayButton(d){let arr=dayWords(d),n=reviewedCount(arr);return `<button class="daycard ${state.settings.day===d?'selected':''} ${n===10?'done':''}" data-action="day-select" data-day="${d}"><span class="index">روز</span><span class="num">${persianNumber(d)}</span><span class="small muted">${n===10?'✓ تکمیل':`${persianNumber(n)} از ۱۰`}</span><span class="tinybar"><i style="width:${n*10}%"></i></span></button>`;}
function renderPlan(){let w=state.settings.week||1;return `<main class="wrap main"><div class="section-head"><div><h2>برنامه دقیق ۶ هفته‌ای</h2><p>۳۰ روز × ۱۰ واژه = ۳۰۰ واژه · هر هفته ۵ روز</p></div></div><div class="week-tabs">${Array.from({length:6},(_,i)=>`<button class="${w===i+1?'active':''}" data-action="week-select" data-week="${i+1}">هفته ${persianNumber(i+1)}</button>`).join('')}</div><div class="section-head"><div><h2>روزهای هفته ${persianNumber(w)}</h2><p>می‌توانی هر روز را باز کنی و با سرعت خودت پیش بروی.</p></div><button class="btn sm pale" data-action="quiz-start" data-mode="week" data-week="${w}">آزمون این هفته</button></div><div class="day-grid">${Array.from({length:5},(_,i)=>renderDayButton((w-1)*5+i+1)).join('')}</div><div class="panel" style="margin-top:17px"><div class="flex between"><h3 class="mini-title">جزئیات هفته ${persianNumber(w)}</h3><strong class="muted">${persianNumber(reviewedCount(weekWords(w)))} / ۵۰</strong></div><div style="margin:16px 0">${progressBar(reviewedCount(weekWords(w)),50)}</div>${Array.from({length:5},(_,i)=>{let d=(w-1)*5+i+1,ws=dayWords(d);let lessons='ترکیبی از '+persianNumber(new Set(ws.map(v=>v.lesson)).size)+' درس';return `<div class="listcard" style="margin-bottom:8px"><div><strong>روز ${persianNumber(d)}</strong><div class="muted small" style="margin-top:5px">${lessons} · ${persianNumber(reviewedCount(ws))} واژه مطالعه‌شده</div></div><div class="flex"><button class="btn sm" data-action="day-select" data-day="${d}">انتخاب</button><button class="btn sm pale" data-action="study-day" data-day="${d}">کارت‌ها</button></div></div>`}).join('')}</div><div class="tipbox" style="margin-top:15px">برای تنوع و یادگیری بهتر، واژه‌ها از درس‌های مختلف کتاب ترکیب شده‌اند؛ هر روز دقیقاً ۱۰ واژه با دست‌کم ۹ حرف آغازین متفاوت دارد. شماره درس اصلی در کارت هر واژه حفظ شده است.</div></main>`;}
function renderWordRow(w,i){let s=state.cards[w.id],rating=s?.level||0;return `<div class="listcard scrolltarget" style="margin-bottom:8px"><div class="word-main"><div class="word-num">${persianNumber(i+1)}</div><div style="min-width:0"><div class="word-term">${escapeHTML(w.w)}</div><div class="word-meaning">${escapeHTML(w.fa)} · درس ${persianNumber(w.lesson)} ${rating>=3?'· ✓ مسلط':rating>0?'· در حال مرور':''}</div></div></div><div class="flex"><button class="btn sm icon-btn" data-action="favorite" data-id="${w.id}" aria-label="نشان کردن">${state.favorites[w.id]?'★':'☆'}</button><button class="btn sm pale" data-action="open-card" data-id="${w.id}">بخوان</button></div></div>`;}
function renderLibrary(){let tab=ui.libraryTab||'days';const search=ui.search.trim().toLowerCase();let filtered=VOCAB.filter(v=>(!search||[v.w,v.fa,v.syn,v.example].join(' ').toLowerCase().includes(search))&&(ui.filter==='all'||(ui.filter==='favorites'&&state.favorites[v.id])||(ui.filter==='weak'&&(state.wrongCounts[v.id]||0)>0)||(ui.filter==='mastered'&&mastered(v.id))));let base=tab==='days'?dayWords(state.settings.day):tab==='week'?weekWords(state.settings.week):tab==='book'?filtered:filtered;let list=base.filter(v=>filtered.includes(v));return `<main class="wrap main"><div class="section-head"><div><h2>واژه‌نامه و فلش‌کارت‌ها</h2><p>جست‌وجو در ۳۰۰ واژه، معنی فارسی و مترادف</p></div><span class="chip">${persianNumber(filtered.length)} واژه</span></div><input id="wordSearch" class="searchbar" placeholder="جست‌وجوی فارسی یا انگلیسی..." type="search" autocomplete="off" aria-label="جست‌وجوی واژه"><div class="seg-tabs">${[['days','روز انتخابی'],['week','هفته انتخابی'],['book','همه واژه‌ها']].map(([v,label])=>`<button data-action="library-tab" data-tab="${v}" class="${tab===v?'active':''}">${label}</button>`).join('')}</div><div class="seg-tabs">${[['all','همه'],['favorites','نشان‌شده‌ها'],['weak','اشتباهات'],['mastered','تسلط‌یافته']].map(([v,label])=>`<button class="${ui.filter===v?'active':''}" data-action="filter" data-filter="${v}">${label}</button>`).join('')}</div><div class="flex between" style="margin-bottom:13px;flex-wrap:wrap"><span class="muted">${tab==='days'?`روز ${persianNumber(state.settings.day)}`:tab==='week'?`هفته ${persianNumber(state.settings.week)}`:'کل واژه‌ها'}</span><div class="flex"><button class="btn sm" data-action="study-filter">مطالعه این فهرست</button></div></div><div id="wordResults">${list.length?list.map((v,i)=>renderWordRow(v,i)).join(''):'<div class="empty">واژه‌ای با این شرایط پیدا نشد.</div>'}</div></main>`;}
function renderReview(){let due=dueWords(),wrong=unresolvedWrong(),fav=VOCAB.filter(v=>state.favorites[v.id]),list=ui.reviewTab==='due'?due:ui.reviewTab==='wrong'?wrong:fav;return `<main class="wrap main"><div class="section-head"><div><h2>مرور هوشمند</h2><p>زمان مرور بعدی بر اساس میزان یادگیری تو تنظیم می‌شود</p></div></div><section class="cards3">${statcard('موعد مرور',due.length,'آماده تمرین')}${statcard('واژگان اشتباه‌دار',wrong.length,'نیازمند تسلط')}${statcard('نشان‌شده',fav.length,'منتخب خودت')}</section><div class="seg-tabs">${[['due','آماده مرور'],['wrong','اشتباهات'],['fav','نشان‌شده‌ها']].map(([id,label])=>`<button data-action="review-tab" data-tab="${id}" class="${ui.reviewTab===id?'active':''}">${label}</button>`).join('')}</div><div class="panel"><div class="flex between" style="flex-wrap:wrap"><strong>${persianNumber(list.length)} واژه در این گروه</strong><div class="flex"><button class="btn primary sm" data-action="review-list">شروع فلش‌کارت‌ها</button><button class="btn sm" data-action="quiz-start" data-mode="weak">آزمون تقویتی</button></div></div><div style="margin-top:14px">${list.length?list.map((v,i)=>renderWordRow(v,i)).join(''):'<div class="empty">در حال حاضر موردی برای مرور وجود ندارد. با مطالعه واژه‌ها و دادن آزمون، پیشنهادهای هوشمند اینجا ظاهر می‌شوند.</div>'}</div></div><div class="tipbox" style="margin-top:15px">دکمه «نیاز به تمرین» موعد مرور را نزدیک می‌کند؛ «بلدم» فاصله مرور را بیشتر می‌کند؛ و «خیلی آسان» آن را بیشتر افزایش می‌دهد. پاسخ غلط در آزمون هم واژه را برای مرور فوری در اولویت قرار می‌دهد.</div></main>`;}
function renderCard(){if(!ui.cardIds.length||ui.cardIndex<0||ui.cardIndex>=ui.cardIds.length){setScreen('home');return '';}let id=ui.cardIds[ui.cardIndex],w=WORD_BY_ID[id];if(!w){setScreen('home');return '';}let st=state.cards[id]||{},fav=!!state.favorites[id];let text=escapeHTML(w.example),regex=new RegExp('('+w.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','i');text=text.replace(regex,'<mark class="example-highlight">$1</mark>');let num=ui.cardIndex+1;return `<main class="study-shell"><div class="study-bar"><button class="btn sm" data-action="back">← بازگشت</button><span class="chip">کارت ${persianNumber(num)} از ${persianNumber(ui.cardIds.length)}</span><button class="btn sm icon-btn" data-action="favorite" data-id="${id}" aria-label="نشان کردن">${fav?'★':'☆'}</button></div><div class="card-progress">${progressBar(num,ui.cardIds.length)}</div><article class="flip-area"><div class="flex between"><span class="word-badge">درس ${persianNumber(w.lesson)} · روز ${persianNumber(w.day)}</span><span class="chip">${POS_LABEL[w.pos]||w.pos}</span></div><h1 class="bigword ltr" lang="en">${escapeHTML(w.w)}</h1><div class="pronounce"><button class="btn sm pale" data-action="speak" data-word="${id}" aria-label="پخش تلفظ انگلیسی">🔊 شنیدن تلفظ انگلیسی</button><span class="small muted">صدای داخلی گوشی</span></div><div class="meaning-label" style="text-align:center">معنی فارسی</div><div class="card-meaning">${escapeHTML(w.fa)}</div><div class="info-grid"><div class="info-tile"><span class="muted small">مترادف انگلیسی</span><div class="eng" lang="en">${escapeHTML(w.syn)}</div></div><div class="info-tile"><span class="muted small">نقش دستوری</span><div style="font-weight:800;margin-top:8px">${POS_LABEL[w.pos]||w.pos}</div></div></div><div class="divider"></div><div class="meaning-label">مثال انگلیسی در بافت جمله</div><div class="english-example" lang="en">${text}</div>${state.settings.showTranslation?`<div class="example-fa">${escapeHTML(w.translation)}</div>`:''}<div class="tipbox" style="margin-top:17px"><b>نکته یادگیری:</b> سعی کن ابتدا جمله انگلیسی را خودت معنی کنی و بعد معنی فارسی را مرور کنی. در تست MSRT ممکن است همین واژه با جمله‌ای متفاوت مطرح شود.</div><div class="muted small" style="margin-top:16px">${st.reps?`مرور انجام‌شده: ${persianNumber(st.reps)} بار · سطح: ${persianNumber(st.level||0)} از ۵`:'هنوز میزان تسلط این واژه ثبت نشده است.'}</div></article><div style="text-align:center;margin-bottom:10px"><b>این واژه را چقدر یاد گرفتی؟</b></div><div class="rate-row"><button class="again" data-action="rate" data-grade="again">↺ نیاز به تمرین</button><button class="good" data-action="rate" data-grade="good">✓ بلدم</button><button class="easy" data-action="rate" data-grade="easy">★ خیلی آسان</button></div><div class="card-footer"><button class="btn" data-action="prev-card" ${ui.cardIndex===0?'disabled':''}>→ قبلی</button><button class="btn" data-action="next-card" ${ui.cardIndex===ui.cardIds.length-1?'disabled':''}>بعدی ←</button></div></main>`;}
function markSeen(w){if(!w)return;state.viewed[w.id]=Date.now();safeSave();}
function openCards(ids,index=0,back=null){let clean=[...new Set(ids.map(Number))].filter(id=>WORD_BY_ID[id]);if(!clean.length){toast('در این گروه واژه‌ای وجود ندارد.');return;}ui.cardIds=clean;ui.cardIndex=Math.min(clean.length-1,Math.max(0,index));ui.cardBack=back||((['home','plan','library','review','reports'].includes(ui.screen))?ui.screen:'home');ui.screen='card';markSeen(WORD_BY_ID[ui.cardIds[ui.cardIndex]]);render();scrolTop();if(state.settings.autoSpeech)speak(WORD_BY_ID[ui.cardIds[ui.cardIndex]].w);}
function stepCard(delta){let next=ui.cardIndex+delta;if(next<0||next>=ui.cardIds.length){toast(next>=ui.cardIds.length?'به پایان کارت‌های این بخش رسیدی.':'در ابتدای کارت‌ها هستی.');return;}ui.cardIndex=next;markSeen(WORD_BY_ID[ui.cardIds[next]]);render();scrolTop();if(state.settings.autoSpeech)speak(WORD_BY_ID[ui.cardIds[next]].w);}
function cardReview(id,grade){let now=Date.now(),old=state.cards[id]||{level:0,reps:0,lapses:0,streak:0};let level=old.level,delay=0;if(grade==='again'){level=0;old.streak=0;old.lapses=(old.lapses||0)+1;delay=20*60*1000;}else{level=Math.min(5,level+(grade==='easy'?2:1));old.streak=(old.streak||0)+1;let intervals=[0,1,3,7,14,30];delay=intervals[level]*86400000;}state.cards[id]={...old,level,reps:(old.reps||0)+1,last:now,due:now+delay};safeSave();}
function rateCard(grade){let id=ui.cardIds[ui.cardIndex];cardReview(id,grade);if(ui.cardIndex+1<ui.cardIds.length){stepCard(1);}else{let d=WORD_BY_ID[id].day;render();toast('پایان مجموعه کارت‌ها! اکنون می‌توانی آزمون بدهی.');}}
function speak(word){if(!('speechSynthesis' in window)){toast('امکان تلفظ صوتی در این مرورگر موجود نیست.');return;}try{speechSynthesis.cancel();let utter=new SpeechSynthesisUtterance(word);utter.lang='en-US';utter.rate=.81;let voices=speechSynthesis.getVoices().filter(x=>x.lang.startsWith('en'));if(voices.length)utter.voice=voices.find(x=>x.lang==='en-US')||voices[0];speechSynthesis.speak(utter);}catch(e){toast('تلفظ در این دستگاه در دسترس نیست.');}}
function stableShuffle(items){let arr=[...items];for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function posGroup(w){return w.pos==='v'||w.pos==='v/n'||w.pos==='ph.v'?'v':w.pos==='n'||w.pos==='n/v'?'n':w.pos==='adj'?'adj':w.pos==='adv'?'adv':'other';}
function optionsFor(w,kind){const fmt=v=>kind==='meaning'?v.fa:kind==='synonym'?v.syn:v.w;let correct=fmt(w);let pool=VOCAB.filter(x=>x.id!==w.id && posGroup(x)===posGroup(w) && fmt(x).toLowerCase()!==correct.toLowerCase());pool=stableShuffle(pool);let opts=[{label:correct,id:w.id,correct:true}];let seen=new Set([correct.toLowerCase()]);for(let x of pool){let t=fmt(x);if(!seen.has(t.toLowerCase())){opts.push({label:t,id:x.id,correct:false});seen.add(t.toLowerCase());if(opts.length===4)break;}}if(opts.length<4){for(let x of stableShuffle(VOCAB)){let t=fmt(x);if(!seen.has(t.toLowerCase())){opts.push({label:t,id:x.id,correct:false});seen.add(t.toLowerCase());if(opts.length===4)break;}}}return stableShuffle(opts).map((o,i)=>({label:o.label,correct:o.correct,key:String(i)}));}
function quizQuestion(w,i){const kind=['meaning','synonym','context'][i%3];let prompt,opts;if(kind==='meaning'){prompt=`معنی درست واژه «${w.w}» کدام است؟`;opts=optionsFor(w,'meaning');}else if(kind==='synonym'){prompt=`نزدیک‌ترین مترادف انگلیسی «${w.w}» کدام است؟`;opts=optionsFor(w,'synonym');}else {let example=w.example;let regex=new RegExp(w.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i');example=example.replace(regex,'________');prompt=`جای خالی این جمله را کامل کن:\n${example}`;opts=optionsFor(w,'context');}return {id:w.id,kind,prompt,opts};}
function generateQuiz(mode,day,week){let words,limit,label;if(mode==='day'){words=dayWords(day);limit=10;label=`آزمون روز ${persianNumber(day)}`;}else if(mode==='week'){words=weekWords(week);limit=20;label=`آزمون هفته ${persianNumber(week)}`;}else if(mode==='all'){words=VOCAB;limit=50;label='آزمون جامع ۳۰۰ واژه';}else {words=[...new Map([...unresolvedWrong(),...dueWords()].map(w=>[w.id,w])).values()];if(words.length<4){words=VOCAB.filter(v=>studied(v.id));}limit=Math.min(20,words.length);label='آزمون تقویتی واژگان دشوار';}if(!words.length){toast('برای آزمون تقویتی، ابتدا چند واژه مطالعه کن.');return;}if(state.quiz){toast('یک آزمون ناتمام داری؛ ابتدا آن را تمام کن یا انصراف بده.');ui.screen='quiz';render();scrolTop();return;}let picked=stableShuffle(words).slice(0,limit);state.quiz={mode,label,day,week,items:picked.map((w,i)=>quizQuestion(w,i)),answers:{},cursor:0,start:Date.now()};safeSave();ui.screen='quiz';render();scrolTop();}
function renderQuiz(){const qz=state.quiz;if(!qz){return `<main class="wrap main"><div class="empty">آزمونی در حال اجرا نیست.</div></main>`;}let q=qz.items[qz.cursor],answered=Object.keys(qz.answers).length;return `<main class="wrap main"><div class="quiz-head"><button class="btn sm" data-action="quit-quiz">انصراف از آزمون</button><strong>${escapeHTML(qz.label)}</strong><span class="chip">${persianNumber(qz.cursor+1)} / ${persianNumber(qz.items.length)}</span></div><section class="quiz-box"><div class="flex between"><span class="muted small">${q.kind==='meaning'?'تشخیص معنی':q.kind==='synonym'?'مترادف انگلیسی':'واژه در جمله'}</span><strong class="muted small">پاسخ‌داده: ${persianNumber(answered)}</strong></div><div style="margin:13px 0">${progressBar(answered,qz.items.length)}</div><h1 class="qtitle" style="white-space:pre-line">${escapeHTML(q.prompt)}</h1><div class="options">${q.opts.map((o,i)=>`<button class="option ${qz.answers[qz.cursor]===o.key?'selected':''}" data-action="answer" data-option="${o.key}"><span class="letter">${'ABCD'[i]}</span><span ${q.kind==='meaning'?'':'class="ltr" style="font-family:Arial, sans-serif;text-align:left"'}>${escapeHTML(o.label)}</span></button>`).join('')}</div><div class="qnav">${qz.items.map((x,i)=>`<button aria-label="سؤال ${i+1}" class="qdot ${Object.hasOwn(qz.answers,i)?'answered':''} ${qz.cursor===i?'current':''}" data-action="question" data-q="${i}">${persianNumber(i+1)}</button>`).join('')}</div><div class="flex between"><button class="btn" data-action="qprev" ${qz.cursor===0?'disabled':''}>→ سؤال قبلی</button>${qz.cursor<qz.items.length-1?`<button class="btn primary" data-action="qnext">سؤال بعدی ←</button>`:`<button class="btn primary" data-action="quiz-finish">پایان آزمون و کارنامه</button>`}</div><div class="muted small" style="margin-top:18px;line-height:2">پاسخ درست تا پایان آزمون نمایش داده نمی‌شود. انتخاب‌های تو ذخیره می‌شوند و اگر صفحه بسته شود، می‌توانی ادامه بدهی.</div></section></main>`;}
function finishQuiz(){let qz=state.quiz;if(!qz)return;let missing=qz.items.length-Object.keys(qz.answers).length;if(missing&& !confirm(`به ${missing} سؤال پاسخ نداده‌ای. آیا آزمون را ثبت کنم؟`))return;let items=qz.items.map((q,i)=>{let chosen=q.opts.find(o=>o.key===qz.answers[i]);let right=q.opts.find(o=>o.correct);let correct=!!chosen&&chosen.correct;return {id:q.id,kind:q.kind,prompt:q.prompt,chosen:chosen?.label||'بدون پاسخ',right:right?.label||'',correct};});let score=items.filter(x=>x.correct).length;let record={id:Date.now()+Math.random(),mode:qz.mode,label:qz.label,day:qz.day,week:qz.week,score,total:items.length,when:Date.now(),duration:Math.floor((Date.now()-qz.start)/1000),items};state.exams.unshift(record);if(state.exams.length>500)state.exams.length=500;for(let item of items){if(!item.correct)state.wrongCounts[item.id]=(state.wrongCounts[item.id]||0)+1;cardReview(item.id,item.correct?'good':'again');}state.quiz=null;safeSave();ui.result=record;ui.screen='results';render();scrolTop();}
function renderResults(){let r=ui.result||state.exams[0];if(!r)return `<main class="wrap main"><div class="empty">کارنامه‌ای برای نمایش موجود نیست.</div></main>`;let percent=Math.round(r.score/r.total*100);return `<main class="wrap main"><div style="max-width:810px;margin:auto"><div class="section-head"><div><h2>کارنامه آزمون</h2><p>${escapeHTML(r.label)} · ${dateFa(r.when)}</p></div><button class="btn sm" data-action="nav" data-page="reports">آرشیو کارنامه‌ها</button></div><section class="results-cover"><div>نمره این آزمون</div><div class="score-big">${persianNumber(percent)}٪</div><div>${persianNumber(r.score)} پاسخ صحیح از ${persianNumber(r.total)} سؤال</div><p style="color:#c8e7e3;font-size:12px">${percent>=80?'عالی! روی تثبیت واژه‌های باقیمانده تمرکز کن.':percent>=60?'خوب پیش رفتی؛ اشتباهات را امروز مرور کن.':'برای تسلط بهتر، اشتباهات و کارت‌های نیازمند تمرین را تکرار کن.'}</p></section><div class="cards3">${statcard('درست',r.score,'پاسخ صحیح')}${statcard('نادرست',r.total-r.score,'شامل بی‌پاسخ')}${statcard('درصد',percent,'نمره ذخیره‌شده')}</div><div class="dashboard-actions" style="margin:15px 0"><button class="btn primary" data-action="study-wrong-result">مطالعه اشتباهات این آزمون</button><button class="btn" data-action="nav" data-page="reports">دیدن همه نمرات</button></div><div class="section-head"><div><h2>تحلیل تک‌تک سؤال‌ها</h2><p>پاسخ خودت، جواب درست و مثال آموزشی را بررسی کن</p></div></div>${r.items.map((item,i)=>{let w=WORD_BY_ID[item.id];return `<section class="result-item ${item.correct?'right':'wrong'}"><div class="flex between"><strong>${persianNumber(i+1)}. <span class="ltr">${escapeHTML(w.w)}</span></strong><span class="pill">${item.correct?'✓ درست':'✕ نادرست'}</span></div><div class="muted small" style="white-space:pre-line;line-height:1.9;margin-top:10px">${escapeHTML(item.prompt)}</div><div class="answer-grid"><div>پاسخ تو: <span class="${item.correct?'right-value':'wrong-value'}">${escapeHTML(item.chosen)}</span></div><div>پاسخ صحیح: <span class="right-value">${escapeHTML(item.right)}</span></div><div>معنی واژه: <b>${escapeHTML(w.fa)}</b></div><div class="muted">${escapeHTML(w.example)}</div><div class="muted">${escapeHTML(w.translation)}</div></div><button class="btn sm" style="margin-top:12px" data-action="open-card" data-id="${w.id}">مرور این واژه</button></section>`;}).join('')}</div></main>`;}
function renderReports(){let exams=state.exams;let avg=exams.length?Math.round(exams.reduce((a,v)=>a+v.score/v.total*100,0)/exams.length):0;let best=exams.length?Math.max(...exams.map(v=>Math.round(v.score/v.total*100))):0;return `<main class="wrap main"><div class="section-head"><div><h2>کارنامه و تحلیل پیشرفت</h2><p>نمره‌ها به ترتیب تاریخ و همراه با ریز اشتباهات ذخیره می‌شوند</p></div><button class="btn sm pale" data-action="quiz-start" data-mode="all">آزمون جامع</button></div><section class="cards3">${statcard('میانگین آزمون‌ها',avg+'٪','میانگین درصد نمره‌ها')}${statcard('بهترین نمره',best+'٪','بالاترین درصد')}${statcard('کل آزمون‌ها',exams.length,'ثبت‌شده روی گوشی')}</section><div class="grid2" style="margin-top:16px"><section class="panel"><h3 class="mini-title">پیشرفت واژگان طی ۶ هفته</h3><p class="muted small">تعداد واژه‌هایی که دست‌کم یک بار میزان یادگیری آن‌ها را ثبت کردی</p><div class="bar-plot">${Array.from({length:6},(_,i)=>{let n=reviewedCount(weekWords(i+1));return `<div class="bar-column"><span class="bar-num">${persianNumber(n)}</span><div class="bar" style="--h:${Math.max(3,n/50*100)}%"></div><span class="bar-label">هفته ${persianNumber(i+1)}</span></div>`}).join('')}</div></section><section class="panel"><h3 class="mini-title">سطوح یادگیری</h3><p class="muted small">فاصله مرور بر اساس پاسخ‌ها تنظیم می‌شود</p><div style="margin-top:20px">${[['مطالعه‌نشده',VOCAB.filter(v=>!studied(v.id)).length],['در حال تمرین',VOCAB.filter(v=>studied(v.id)&&!mastered(v.id)).length],['تسلط‌یافته',masteredCount(VOCAB)]].map(([s,n])=>`<div class="weekprogress-row"><div class="flex between"><span>${s}</span><strong>${persianNumber(n)}</strong></div><div style="margin-top:7px">${progressBar(n,300)}</div></div>`).join('')}</div></section></div><div class="section-head"><div><h2>تاریخچه آزمون‌ها</h2><p>${persianNumber(exams.length)} کارنامه ذخیره‌شده</p></div></div><div class="panel">${exams.length?`<div class="history">${exams.map((r,i)=>`<div class="history-item"><div><strong>${escapeHTML(r.label)}</strong><div class="muted small" style="margin-top:5px">${dateFa(r.when)} · ${persianNumber(r.total)} سؤال</div></div><div class="flex"><strong style="color:var(--tealDeep)">${persianNumber(Math.round(r.score/r.total*100))}٪</strong><button class="btn sm" data-action="view-result" data-result="${i}">جزئیات</button></div></div>`).join('')}</div>`:'<div class="empty">هنوز آزمونی نداده‌ای. بعد از اولین آزمون، نمره و اشتباهاتت در این بخش ثبت می‌شوند.</div>'}</div></main>`;}
function renderSettings(){return `<main class="wrap main"><div class="section-head"><div><h2>تنظیمات و حفظ اطلاعات</h2><p>ذخیره خودکار در حافظه Chrome؛ اجرای آفلاین پس از نصب از یک آدرس HTTPS بدون رمز</p></div></div><div class="grid2"><section class="panel"><h3 class="mini-title">تنظیمات یادگیری</h3><div class="setting-row"><div><strong>حالت تیره</strong><div class="muted small">مناسب مطالعه شبانه</div></div><input type="checkbox" class="switch" data-setting="theme" ${state.settings.theme==='dark'?'checked':''} aria-label="حالت تیره"></div><div class="setting-row"><div><strong>ترجمه جمله زیر فلش‌کارت</strong><div class="muted small">می‌توانی آن را مخفی کنی و خودت معنی کنی</div></div><input type="checkbox" class="switch" data-setting="showTranslation" ${state.settings.showTranslation?'checked':''}></div><div class="setting-row"><div><strong>تلفظ خودکار در کارت‌ها</strong><div class="muted small">به موتور گفتار انگلیسی گوشی نیاز دارد</div></div><input type="checkbox" class="switch" data-setting="autoSpeech" ${state.settings.autoSpeech?'checked':''}></div><div class="setting-row"><div><strong>روز انتخابی</strong><select id="daySetting" class="btn" style="max-width:125px">${Array.from({length:30},(_,i)=>`<option value="${i+1}" ${state.settings.day===i+1?'selected':''}>روز ${persianNumber(i+1)}</option>`).join('')}</select></div><p class="footnote">برنامه روزهای مطالعه را خودکار با تقویم جلو نمی‌برد؛ بنابراین اگر چند روز مطالعه نکردی چیزی را از دست نمی‌دهی. روز بعد را خودت انتخاب کن.</p></section><section class="panel"><h3 class="mini-title">آیکون روی صفحه اصلی گوشی</h3><p class="muted small" style="line-height:2">روی «نصب روی گوشی» بزن تا اگر Chrome اجازه بدهد پنجره نصب باز شود. در غیر این صورت راهنمای دقیق نمایش داده می‌شود. فایل HTML محلی در Downloads به‌تنهایی قابلیت نصب PWA ندارد.</p><button class="btn primary full" data-action="install-app" style="margin:10px 0 15px">＋ نصب روی گوشی</button><div class="divider"></div><h3 class="mini-title">ذخیره خودکار پیشرفت</h3><div class="tipbox" id="storageInfo">${storageMode==='android'?'✓ اطلاعات به‌طور خودکار در حافظه اختصاصی اپ اندروید ذخیره می‌شوند و با بستن برنامه پاک نمی‌شوند.':'✓ نمرات، تنظیمات، کارت‌ها و آزمون نیمه‌تمام با هر تغییر ذخیره می‌شوند و پس از بستن و بازکردن دوباره همان آدرس بازیابی می‌گردند. پاک‌کردن داده‌های Chrome یا تغییر آدرس سایت می‌تواند آن‌ها را حذف کند؛ مرتب پشتیبان JSON بگیر.'}</div><div class="divider"></div><h3 class="mini-title">پشتیبان‌گیری و بازیابی</h3><p class="muted" style="line-height:2">برای جلوگیری از از دست رفتن نمرات، فلش‌کارت‌های مرورشده و اشتباهات، هر چند وقت یک‌بار نسخه پشتیبان ذخیره کن.</p><div class="dashboard-actions"><button class="btn primary" data-action="backup">↓ خروجی JSON</button><button class="btn" data-action="restore">↑ بازیابی پشتیبان</button></div><div class="divider"></div><h3 class="mini-title">انتقال اطلاعات از نسخه قدیمی</h3><p class="muted small" style="line-height:2">اگر برنامه قبلی را با مرورگر باز می‌کردی، فایل پشتیبان JSON آن را بگیر. متن JSON را از فایل کپی کن و اینجا بچسبان تا نمره‌ها و پیشرفت قبلی منتقل شوند. در نسخه APK برای تهیه پشتیبان نیز می‌توانی از متن انتخاب‌شده کپی بگیری.</p><textarea id="pastedBackup" class="searchbar" style="resize:vertical;min-height:86px;direction:ltr;text-align:left" placeholder="متن فایل پشتیبان JSON را اینجا بچسبان ..."></textarea><button class="btn pale full" style="margin-top:8px" data-action="restore-pasted">بازیابی از متن پشتیبان</button><div class="divider"></div><h3 class="mini-title">شروع مجدد</h3><p class="muted small" style="line-height:2">فقط اگر می‌خواهی تمام نمرات و تاریخچه مرور پاک شوند از این گزینه استفاده کن.</p><button class="btn danger" data-action="reset">پاک‌کردن کل پیشرفت</button><div class="tipbox" style="margin-top:19px">نسخه ۲.۱ · بانک ۳۰۰ واژه · روزهای ترکیبی · بدون نیاز به ثبت‌نام یا اینترنت · ذخیره روی دستگاه</div></section></div><div class="panel" style="margin-top:17px"><h3 class="mini-title">درباره منابع و محدوده برنامه</h3><p style="line-height:2;color:var(--sub)">۳۰۰ واژه از ۱۸ درس آغازین Essential Words for the TOEFL، ویرایش هفتم، انتخاب و برای جلوگیری از تکرار حروف ابتدایی، بین روزها توزیع شده‌اند؛ شماره درس اصلی هر واژه حفظ شده است. معانی فارسی، جملات و سؤال‌های برنامه محتوای آموزشی مستقل هستند و متن تمرین‌های کتاب نیستند. این برنامه مخصوص تقویت لغت است و جایگزین مطالعه گرامر، Reading و Listening آزمون MSRT نمی‌شود.</p><p class="footnote">این برنامه از مرور فاصله‌دار تطبیقی استفاده می‌کند، نه هوش مصنوعی ابری. هیچ داده‌ای به سرور ارسال نمی‌شود. عملکرد بخش تلفظ به امکانات Android و مرورگر بستگی دارد.</p></div></main>`;}
function handleAction(btn){let a=btn.dataset.action;let id=Number(btn.dataset.id||0),day=Number(btn.dataset.day||0),week=Number(btn.dataset.week||0);switch(a){case 'nav':if(btn.dataset.page==='reports'&&state.quiz){/* no block */}setScreen(btn.dataset.page);break;case 'theme':state.settings.theme=state.settings.theme==='light'?'dark':'light';safeSave();render();break;case 'day-select':state.settings.day=day;state.settings.week=Math.ceil(day/5);safeSave();ui.screen=ui.screen==='plan'?'plan':'home';render();break;case 'week-select':state.settings.week=week;safeSave();render();break;case 'study-day':if(day){state.settings.day=day;state.settings.week=Math.ceil(day/5);safeSave();}openCards(dayWords(day||state.settings.day).map(v=>v.id));break;case 'open-card':openCards([id]);break;case 'favorite':state.favorites[id]=!state.favorites[id];if(!state.favorites[id])delete state.favorites[id];safeSave();render();break;case 'back':setScreen(ui.cardBack||'home');break;case 'prev-card':stepCard(-1);break;case 'next-card':stepCard(1);break;case 'rate':rateCard(btn.dataset.grade);break;case 'speak':speak(WORD_BY_ID[id].w);break;case 'library-tab':ui.libraryTab=btn.dataset.tab;render();break;case 'filter':ui.filter=btn.dataset.filter;render();break;case 'study-filter':{let t=ui.libraryTab;let words=VOCAB.filter(v=>{let q=ui.search.trim().toLowerCase(),s=(!q||[v.w,v.fa,v.syn,v.example].join(' ').toLowerCase().includes(q))&&(ui.filter==='all'||(ui.filter==='favorites'&&state.favorites[v.id])||(ui.filter==='weak'&&(state.wrongCounts[v.id]||0)>0)||(ui.filter==='mastered'&&mastered(v.id)));return s&&(t==='book'||(t==='days'&&v.day===state.settings.day)||(t==='week'&&v.week===state.settings.week));});openCards(words.map(v=>v.id));break;}case 'review-tab':ui.reviewTab=btn.dataset.tab;render();break;case 'review-due':openCards(dueWords().map(v=>v.id),'','home');break;case 'review-list':{let l=ui.reviewTab==='due'?dueWords():ui.reviewTab==='wrong'?unresolvedWrong():VOCAB.filter(v=>state.favorites[v.id]);openCards(l.map(v=>v.id));break;}case 'resume-quiz':ui.screen='quiz';render();scrolTop();break;case 'quiz-start':generateQuiz(btn.dataset.mode,day||state.settings.day,week||state.settings.week);break;case 'answer':state.quiz.answers[state.quiz.cursor]=btn.dataset.option;safeSave();render();break;case 'question':state.quiz.cursor=Number(btn.dataset.q);safeSave();render();break;case 'qprev':state.quiz.cursor=Math.max(0,state.quiz.cursor-1);safeSave();render();break;case 'qnext':state.quiz.cursor=Math.min(state.quiz.items.length-1,state.quiz.cursor+1);safeSave();render();break;case 'quiz-finish':finishQuiz();break;case 'quit-quiz':askConfirm('انصراف از آزمون','پاسخ‌های آزمون ناتمام حذف شوند؟ نمره‌ای ثبت نخواهد شد.',()=>{state.quiz=null;safeSave();setScreen('home');});break;case 'view-result':ui.result=state.exams[Number(btn.dataset.result)];ui.screen='results';render();scrolTop();break;case 'study-wrong-result':{let r=ui.result||state.exams[0];openCards(r.items.filter(x=>!x.correct).map(x=>x.id));break;}case 'install-app':installPWA();break;case 'close-install-guide':document.getElementById('installGuide').close();break;case 'backup':downloadBackup();break;case 'restore':if(storageMode==='android'){let input=$('#pastedBackup');if(input){input.focus();input.scrollIntoView({behavior:'smooth',block:'center'});toast('متن JSON پشتیبان را در کادر بچسبان و بازیابی بزن.');}}else $('#restoreInput').click();break;case 'restore-pasted':{let t=$('#pastedBackup').value.trim();try{let x=JSON.parse(t);if(x.app!=='MSRT-300'||x.version!==1||!x.data||x.data.v!==1||!x.data.cards||!Array.isArray(x.data.exams))throw Error('ساختار پشتیبان معتبر نیست');askConfirm('بازیابی پشتیبان','پیشرفت فعلی با اطلاعات پشتیبان جایگزین شود؟',()=>{let def=makeDefault();state={...def,...x.data,settings:{...def.settings,...x.data.settings},session:{screen:'home',cardIds:[],cardIndex:0}};state.quiz=null;ui.screen='home';safeSave();render();toast('بازیابی انجام شد.');});}catch(e){toast('متن JSON معتبر نیست: '+e.message);}break;}case 'reset':askConfirm('حذف کامل پیشرفت','همه کارنامه‌ها، نتایج آزمون‌ها، کارت‌ها و مرورها پاک خواهند شد. این عمل بازگشت‌پذیر نیست.',()=>{state=makeDefault();safeSave();ui={screen:'home',cardIds:[],cardIndex:0,filter:'all',search:'',libraryTab:'days',result:null,reviewTab:'due'};render();toast('پیشرفت‌ها پاک شد.');});break;}}
function askConfirm(title,message,callback){let d=$('#confirmDialog');$('#confirmTitle').textContent=title;$('#confirmMsg').textContent=message;$('#okConfirm').onclick=()=>{d.close();callback();};$('#cancelConfirm').onclick=()=>d.close();d.showModal();}
function downloadBackup(){let payload={app:'MSRT-300',version:1,created:new Date().toISOString(),data:state};if(storageMode==='android'){let el=$('#pastedBackup');if(el){el.value=JSON.stringify(payload);el.focus();el.select();toast('متن پشتیبان انتخاب شد؛ کپی کن و در یادداشت یا فایل ذخیره کن.');return;}}let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`msrt-backup-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2500);toast('فایل پشتیبان ساخته شد. آن را در پوشه امن نگه دار.');}
async function restoreFile(file){try{if(!file||file.size>4*1024*1024)throw new Error('حجم فایل مناسب نیست.');let txt=await file.text(),p=JSON.parse(txt);if(p.app!=='MSRT-300'||p.version!==1||!p.data||p.data.v!==1||!p.data.cards||!Array.isArray(p.data.exams))throw new Error('فایل پشتیبان معتبر نیست.');askConfirm('بازیابی پشتیبان','پیشرفت فعلی با داده‌های این فایل جایگزین شود؟',()=>{let def=makeDefault();state={...def,...p.data,settings:{...def.settings,...p.data.settings}};state.quiz=null;safeSave();setScreen('home');toast('بازیابی با موفقیت انجام شد.');});}catch(e){toast('خطا: '+(e.message||'فایل نامعتبر است'));}finally{$('#restoreInput').value='';}}
function init(){if(TOTAL!==300||new Set(VOCAB.map(v=>v.id)).size!==300||VOCAB.some((v,i)=>v.day!==Math.floor(i/10)+1||v.week!==Math.floor(i/50)+1)){console.error('Vocabulary database validation failed',TOTAL);$('#app').innerHTML='<main class="wrap main"><h2>خطا در داده‌های برنامه</h2></main>';return;}if(state.quiz){ui.screen='quiz';}
else if(state.session){let previous=state.session;
 if(previous.screen==='card'&&Array.isArray(previous.cardIds)&&previous.cardIds.length&&previous.cardIds.every(id=>!!WORD_BY_ID[id])){
  ui.screen='card';ui.cardIds=previous.cardIds;ui.cardIndex=Math.min(Math.max(Number(previous.cardIndex)||0,0),ui.cardIds.length-1);ui.cardBack=previous.cardBack||'home';
 }else if(['home','plan','library','review','reports','settings','results'].includes(previous.screen))ui.screen=previous.screen;
 ui.libraryTab=previous.libraryTab||'days';ui.reviewTab=previous.reviewTab||'due';
}
render();if(restoreError)toast('ذخیره‌سازی در این دستگاه خطا دارد. از تنظیمات، پشتیبان بگیر.');}
document.addEventListener('click',ev=>{let btn=ev.target.closest('[data-action]');if(!btn||btn.disabled)return;handleAction(btn);});
document.addEventListener('input',ev=>{if(ev.target.id==='wordSearch'){let pos=ev.target.selectionStart;ui.search=ev.target.value;let tab=ui.libraryTab;let base=tab==='days'?dayWords(state.settings.day):tab==='week'?weekWords(state.settings.week):VOCAB;let needle=ui.search.trim().toLowerCase();let arr=base.filter(v=>(!needle||[v.w,v.fa,v.syn,v.example].join(' ').toLowerCase().includes(needle))&&(ui.filter==='all'||(ui.filter==='favorites'&&state.favorites[v.id])||(ui.filter==='weak'&&(state.wrongCounts[v.id]||0)>0)||(ui.filter==='mastered'&&mastered(v.id))));$('#wordResults').innerHTML=arr.length?arr.map((v,i)=>renderWordRow(v,i)).join(''):'<div class="empty">واژه‌ای پیدا نشد.</div>';} });
document.addEventListener('change',ev=>{let s=ev.target.dataset.setting;if(s){state.settings[s]=s==='theme'?(ev.target.checked?'dark':'light'):ev.target.checked;safeSave();render();}if(ev.target.id==='daySetting'){let d=Number(ev.target.value);state.settings.day=d;state.settings.week=Math.ceil(d/5);safeSave();toast('روز انتخابی تغییر کرد.');}});
$('#restoreInput').addEventListener('change',ev=>restoreFile(ev.target.files?.[0]));
document.addEventListener('keydown',ev=>{if(ui.screen==='card'&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)){if(ev.key==='ArrowRight')stepCard(-1);if(ev.key==='ArrowLeft')stepCard(1);}else if(ui.screen==='quiz'){let idx=['1','2','3','4'].indexOf(ev.key);if(idx>=0){state.quiz.answers[state.quiz.cursor]=String(idx);safeSave();render();}}});
let touchStart=null;document.addEventListener('touchstart',e=>{if(ui.screen==='card'&&e.touches.length===1){touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY};}},{passive:true});document.addEventListener('touchend',e=>{if(ui.screen!=='card'||!touchStart)return;let dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;touchStart=null;if(Math.abs(dx)>85&&Math.abs(dy)<55){stepCard(dx>0?-1:1);}},{passive:true});

let msrtInstallPrompt=null,installedOffline=false;
const secureWeb=location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1';
const installedView=()=>window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
function showInstallGuide(){
 let info='';
 if(location.protocol==='file:'){
  info='<p>این فایل از Downloads باز شده است. Chrome برای فایل محلی اجازهٔ نصب یک‌کلیکی یا ثبت Service Worker را نمی‌دهد.</p><div class="callout">برای نصب واقعی، پوشهٔ PWA را یک‌بار روی یک سایت <b>HTTPS عمومی و بدون رمز</b> قرار بده، آدرس را با Chrome باز کن و دوباره دکمهٔ نصب را بزن. بعد از ذخیره فایل‌ها، برنامه بدون اینترنت قابل استفاده است.</div><p>خود فایل HTML را می‌توان آفلاین باز کرد، اما شورت‌کات نصب‌شدهٔ قابل‌اعتماد ندارد.</p>';
 }else if(!secureWeb){
  info='<p>نصب PWA فقط از نشانی HTTPS (یا localhost برای توسعه) پشتیبانی می‌شود. لینک را با HTTPS باز کن.</p>';
 }else if(installedView()){
  info='<p>برنامه همین حالا در حالت نصب‌شده اجرا می‌شود. برای باز کردن آن آیکونش را در صفحهٔ اصلی گوشی انتخاب کن.</p>';
 }else{
  info='<p>در Chrome گوشی، منوی سه‌نقطه (⋮) را باز کن و «Install app / نصب برنامه» یا «Add to Home screen / افزودن به صفحهٔ اصلی» را انتخاب کن.</p><div class="callout">دکمهٔ نصب تنها زمانی می‌تواند پنجرهٔ خود Chrome را باز کند که مرورگر آن را مجاز بداند. نصب کاملاً خودکار، بدون تأیید کاربر، ممکن نیست.</div><p>اگر از داخل تلگرام یا مرورگر داخلی باز کرده‌ای، ابتدا لینک را در Google Chrome باز کن.</p>';
 }
 document.getElementById('installGuideBody').innerHTML=info;
 document.getElementById('installGuide').showModal();
}
window.addEventListener('beforeinstallprompt',ev=>{ev.preventDefault();msrtInstallPrompt=ev;updateInstallStatus();});
window.addEventListener('appinstalled',()=>{msrtInstallPrompt=null;updateInstallStatus();toast('نصب انجام شد؛ آیکون واژه‌یار را در صفحه اصلی گوشی پیدا کن.');if(navigator.storage?.persist)navigator.storage.persist().catch(()=>{});});
function updateInstallStatus(){
 const el=document.getElementById('offlineStatus');
 if(!el)return;
 if(installedOffline)el.textContent='✓ فایل‌ها برای آفلاین آماده‌اند';
 else if(location.protocol==='file:')el.textContent='اجرای محلی آفلاین';
 else if(!secureWeb)el.textContent='لینک HTTPS لازم است';
 else if(!navigator.serviceWorker)el.textContent='حالت آفلاین پشتیبانی نشد';
 else el.textContent='در حال آماده‌سازی آفلاین…';
 const btn=document.getElementById('homeInstallBtn');
 if(btn && installedView()){btn.textContent='✓ نصب شده';btn.disabled=true;}
}
async function installPWA(){
 if(installedView()){toast('برنامه روی این گوشی نصب شده است.');return;}
 if(msrtInstallPrompt){
  try{
    const prompt=msrtInstallPrompt;msrtInstallPrompt=null;
    await prompt.prompt();
    if(prompt.userChoice){let choice=await prompt.userChoice;if(choice.outcome==='accepted'){
      toast('درخواست نصب تأیید شد.');if(navigator.storage?.persist)navigator.storage.persist().catch(()=>{});
    }else showInstallGuide();}
  }catch(e){showInstallGuide();}
  return;
 }
 showInstallGuide();
}
async function verifyOfflineReady(){
 if(!('serviceWorker' in navigator)||!secureWeb)return;
 try{
  const c=await caches.match(new URL('./index.html',location.href).href);
  installedOffline=!!c;
 }catch(e){installedOffline=false;}
 updateInstallStatus();
}
if('serviceWorker' in navigator && secureWeb){
 window.addEventListener('load',async()=>{
  try{
    await navigator.serviceWorker.register('./sw.js',{scope:'./'});
    await navigator.serviceWorker.ready;
    await verifyOfflineReady();
  }catch(e){console.warn('Offline cache unavailable:',e);updateInstallStatus();}
 });
}
window.addEventListener('load',updateInstallStatus);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')safeSave();});
window.addEventListener('pagehide',safeSave);
init();
</script>
